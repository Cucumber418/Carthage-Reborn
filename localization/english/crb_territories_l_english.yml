 crb_territories.6.t: "Governing Arabia"
 crb_territories.6.d: "Oasis markets, spice caravans, and coastal trading towns lie scattered across long roads. Merchants would manage these centers through guides and contracts. A governor would send officials to survey each settlement and enter roads and passes in a common register."
 crb_territories.6.f: "\"There is no spare water in the desert, nor should there be an unaccounted line in the ledger.\""
 crb_territories.6.a: "Establish the Arabian Province."
 crb_territories.6.b: "Retain direct Carthaginian rule for now."
