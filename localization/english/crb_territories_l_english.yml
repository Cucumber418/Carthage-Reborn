 crb_territories.1.t: "Governing Mauretania"
 crb_territories.1.d: "Atlantic sea winds meet mountain trade routes here. Caravans carry goods from the interior while coastal merchants await new partners. If a governor is appointed, officials will survey our settlements along the passes and markets."
 crb_territories.1.f: "\"The coast has warehouses, the mountain roads have guides; the Senate still owes them a charter.\""
 crb_territories.1.a: "Establish the Mauretanian Province."
 crb_territories.1.b: "Retain direct Carthaginian rule for now."
