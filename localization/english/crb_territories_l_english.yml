 CPB_DEF: "the Mesopotamian Province"
 crb_territories.5.t: "Governing Mesopotamia"
 crb_territories.5.d: "The waterways of the two rivers wind among towns, farms, and markets. Merchants see opportunities for warehouses and transport; advocates of provincial rule see fields, taxes, and roads to be surveyed. A new chapter awaits the lands we have acquired."
 crb_territories.5.f: "\"Ships come by river and caravans by road. All stop before the city gates.\""
 crb_territories.5.a: "Establish the Mesopotamian Province."
 crb_territories.5.b: "Retain direct Carthaginian rule for now."
