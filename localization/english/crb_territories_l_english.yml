 crb_revenge.6.t: "The Future of Gaul"
 crb_revenge.6.d: "Broad rivers flow through Gaul's fields and towns. Merchants seek warehouses along their banks, while local landholders weigh the new overlord's proposals in their chambers. Trade may gradually bind these lands together, or a governor and inspectors may establish a more direct authority."
 crb_revenge.6.f: "\"Shall the riverboats arrive first, or the governor's seal?\""
 crb_revenge.6.a: "Establish the Gallic Trading Post."
 crb_revenge.6.b: "Establish the Gallic Province."
 crb_revenge.6.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_GLT_effect_tt: "Merchants will open warehouses in river ports and towns. Landholding notables will take part in local assemblies, and the markets of Gaul will open to Mediterranean trade. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_GLT_effect_tt: "The governor will send officials to take charge of town tax registers and inspect the roads and markets, organizing our Gallic lands into Carthage's provincial system. The province pays #v 50%#! of its income."
 GLT: "Gallic Trading Post"
 GLT_ADJ: "Gallic"
 GLT_crb_province: "Gallic Province"
 crb_found_alpine_post_button: "Organize the Alps"
 crb_found_alpine_post_button_desc: "In peacetime, owning at least one non-capital state in the Alps allows us to choose its form of government. Each foundation begins a three-month handover shared by all regions."
 crb_can_found_alpine_trigger: "We own non-capital land in the Alps that can be organized, and the corresponding subject does not yet exist."
 crb_revenge.7.t: "The Future of the Alps"
 crb_revenge.7.d: "The mountains divide settlements among their valleys, yet draw northbound and southbound trade through a handful of passes. Innkeepers, caravans, and the militia guarding the roads await our decision: merchant contracts to sustain the routes, or the governor's officials posted along them."
 crb_revenge.7.f: "\"Whoever holds the passes hears the news from both plains.\""
 crb_revenge.7.a: "Establish the Snow Mountain Trading Post."
 crb_revenge.7.b: "Establish the Alpine Province."
 crb_revenge.7.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_SNT_effect_tt: "Pass markets and caravan inns will anchor the trade routes. Local militia will watch the mountain approaches while merchants carry goods along the roads north and south. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_SNT_effect_tt: "The governor will enter passes, valleys, and stations in a common tax register, posting officials along the main roads so that Carthage's orders can cross the mountains. The province pays #v 50%#! of its income."
 SNT: "Snow Mountain Trading Post"
 SNT_ADJ: "Alpine"
 SNT_crb_province: "Alpine Province"
 crb_handle_rome_button: "Organize Rome"
 crb_handle_rome_button_desc: "In peacetime, owning at least one non-capital state in Rome allows us to choose its form of government. Each foundation begins a three-month handover shared by all regions."
 crb_can_found_rome_trigger: "We own non-capital land in Rome that can be organized, and the corresponding subject does not yet exist."
 crb_revenge.5.t: "The Future of Rome"
 crb_revenge.5.d: "Ancient squares and the ports of the Italian coast now await Carthage's decision. The shipowners would bind the coastal towns through wealth and contracts. The Senate may instead entrust tax registers, official appointments, and urban inspections to a resident governor."
 crb_revenge.5.f: "\"A city that once issued commands may itself await a seal sent from afar.\""
 crb_revenge.5.a: "Establish the Ionian Trading Post."
 crb_revenge.5.b: "Establish the Roman Province."
 crb_revenge.5.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_IOP_effect_tt: "The coastal ports will revolve around the chambers of merchants and shipowners. Wealthy citizens will join local assemblies, and shipping contracts will bind the trading towns together. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_puppet_RPR_effect_tt: "A governor in Rome will appoint officials, maintain the tax rolls, and dispatch inspectors to the towns. The administration will protect Tanit's altars while Italy's possessions render their accounts to Carthage. The province pays #v 50%#! of its income."
 crb_create_province_IOP_effect_tt: "The governor's offices will take charge of the local tax rolls and official appointments, bringing the coastal towns' accounts under Carthage. The province pays #v 50%#! of its income."
 crb_create_province_RPR_effect_tt: "A governor in Rome will appoint officials, maintain the tax rolls, and dispatch inspectors to the towns. The administration will protect Tanit's altars while Italy's possessions render their accounts to Carthage. The province pays #v 50%#! of its income."
