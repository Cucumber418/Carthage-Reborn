 crb_territories.2.t: "Governing Egypt"
 crb_territories.2.d: "The Nile binds fields, granaries, and towns into one long ribbon. Shipowners would join river and sea transport through their warehouses. Advocates of provincial rule unroll their survey books, preparing to bring the valley's revenues under an ordered administration."
 crb_territories.2.f: "\"The river returns each year; the accounts should be settled just as faithfully.\""
 crb_territories.2.a: "Establish the Egyptian Province."
 crb_territories.2.b: "Retain direct Carthaginian rule for now."
