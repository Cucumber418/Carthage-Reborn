 CPF_ADJ: "Phoenician"
 CPF_DEF: "the Phoenician Province"
 crb_territories.3.t: "Governing Phoenicia"
 crb_territories.3.d: "Dyes, textiles, and ancient seaports make these streets seem to echo once more with the speech of Punic merchants. A trading post could renew the contracts across the sea; a governor could place ports, tax registers, and Tanit's altars under one administration."
 crb_territories.3.f: "\"The sails know this coast, and the merchants remember their ancestors' names.\""
 crb_territories.3.a: "Establish the Phoenician Province."
 crb_territories.3.b: "Retain direct Carthaginian rule for now."
 crb_found_syria_province_button: "Organize Syria"
