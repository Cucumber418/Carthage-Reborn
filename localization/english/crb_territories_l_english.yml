 crb_territory_disposition_cooldown: "Administrative Handover"
 crb_territory_disposition_cooldown_desc: "Envoys, scribes, and local officials are completing the administrative handover. For three months, the Senate will not arrange another trading post or province."
 crb_territory_disposition_cooldown_effect_tt: "The Senate will require #v 3#! months to complete this handover. During that time, no new trading posts, provinces, or provincial conversions can be arranged."
 crb_found_hidden_trading_post_effect_tt: "Transfer our directly held non-capital states in this region to a newly established trading post, which becomes a subject of Carthage. Establishing it adds no Infamy."
 crb_create_puppet_CPM_effect_tt: "Merchants will connect the mountain markets to Atlantic trade, opening warehouses to travelers from sea and desert and carrying local revenues back to Carthage. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPM_effect_tt: "The governor's offices will survey the fields and settlements along the trade routes, appoint inspectors to the passes, and enter our Mauretanian lands in a common tax register. The province pays #v 50%#! of its income."
 crb_create_puppet_CPE_effect_tt: "Grain from the Nile and coastal cargoes will fill the merchants' warehouses. Shipowners will arrange transport by contract, linking Egypt's markets to the Mediterranean. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPE_effect_tt: "The governor will compile land surveys and tax registers along the Nile, sending officials to administer the towns and direct the valley's accounts and revenues toward Carthage. The province pays #v 50%#! of its income."
 crb_create_puppet_CPF_effect_tt: "Punic merchants' bargaining will echo through the ancient ports once more. Dyes, textiles, and shipping contracts will bind the Phoenician coast to Carthage. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPF_effect_tt: "The governor's offices will take their place among Phoenicia's towns. Officials will maintain the tax rolls and inspect the ports, while Carthage extends its protection to Tanit's altars. The province pays #v 50%#! of its income."
 crb_create_puppet_CPS_effect_tt: "Merchant contracts will bind caravans, markets, and coastal warehouses together. Syria's roads will once again carry Carthaginian goods toward the east. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPS_effect_tt: "The governor will register towns and caravan settlements for taxation, appointing officials to inspect the roads and bringing our Syrian possessions under one provincial administration. The province pays #v 50%#! of its income."
 crb_create_puppet_CPB_effect_tt: "Markets and river warehouses along the two rivers will open to merchants. Grain and manufactured goods will join Carthage's commercial network by water and land. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPB_effect_tt: "The governor will survey fields and towns along the two rivers, placing officials in charge of the tax rolls and post roads and organizing our holdings into an orderly province. The province pays #v 50%#! of its income."
 crb_create_puppet_CPA_effect_tt: "Merchant contracts will govern oasis markets and caravans. Coastal warehouses will link spices and livestock to ocean commerce, while the trading towns send their revenues to Carthage. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_CPA_effect_tt: "The governor will appoint officials along the oases and post roads, inspecting tax registers and passes and bringing scattered settlements under Carthaginian provincial government. The province pays #v 50%#! of its income."
