 crb_revenge.12.t: "The Future of Iberia"
 crb_revenge.12.d: "Silver mines, vineyards, and Mediterranean ports have once more come within Carthage's reach. The old name of New Carthage recalls ancient campaigns, but today's decision concerns goods, fields, and the authority to which every town will render its accounts."
 crb_revenge.12.f: "\"One road leads to the mines; another leads to the sea.\""
 crb_revenge.12.a: "Establish the Iberian Trading Post."
 crb_revenge.12.b: "Establish the Iberian Province."
 crb_revenge.12.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_IBT_effect_tt: "Silver, wine, and seaborne cargoes will fill the merchants' ledgers as New Carthage's trade routes reach once more into the Iberian interior. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_IBT_effect_tt: "The governor will link towns, mines, and estates through tax registers and post roads. Local officials will answer to Carthage, and its administration will protect the altars of Tanit. The province pays #v 50%#! of its income."
 IBT: "Iberian Trading Post"
 IBT_ADJ: "Iberian"
 IBT_crb_province: "Iberian Province"
 crb_found_gaul_post_button: "Organize Gaul"
 crb_found_gaul_post_button_desc: "In peacetime, owning at least one non-capital state in Gaul allows us to choose its form of government. Each foundation begins a three-month handover shared by all regions."
