l_english:
 je_crb_territories: "Carthage's Territories"
 je_crb_territories_reason: "As its dominions expand, the Senate must settle the government of new lands at home and overseas.\n\n$subject_type_crb_trading_post_desc$\n\n$subject_type_crb_province_desc$\n\nEstablishing a trading post or province, or converting a trading post into a province, begins a three-month administrative handover shared by all regions."
 je_crb_territories_status: "Governing the Territories"
 je_crb_territories_status_desc: "Acquire non-capital land in a region to choose its form of government. New trading posts, provinces, and provincial conversions share a three-month administrative handover."
 je_crb_territories_complete: "Carthage's Territories"
 crb_found_hidden_province_effect_tt: "Transfer our directly held non-capital states in this region to a newly established province, which becomes a subject of Carthage."
 crb_carthaginian_navy: "Carthaginian Fleet"
 crb_flavor.17.t: "Gauls?"
 crb_flavor.17.d: "French flags still fly in North Africa. The historians recall the Gallic tribes who once fought beside Hannibal, while the generals see the French as powerful rivals for Africa.\n\nCopies of ancient agreements lie upon the Senate's tables beside dispatches from the coast. Merchants hope their ships may enter harbor in peace; the officers are more concerned with French garrisons and checkpoints."
 crb_flavor.17.f: "\"Their ancestors marched beside us. Will the French of today accept that ancient friendship?\""
 crb_flavor.17.a: "Recall the Gauls' aid and pay to preserve our friendship."
 crb_flavor_gallic_legacy: "Confronting the Gauls"
 crb_flavor_gallic_legacy_desc: "We have chosen to confront France. The army prepares a fiercer response to these 'Gauls,' increasing Kill Rate by 10% for five years."
 company_crb_carthaginian_trade_house: "Carthaginian Trading House"
 company_crb_tyrian_purple: "Tyrian Purple Company"
 company_crb_punic_wine: "Punic Wine Company"
 company_crb_cyprus_copper: "Cyprus Copper Company"
