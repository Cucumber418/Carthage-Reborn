 crb_found_tripoli_post_button: "Organize Tripoli"
 crb_found_tripoli_post_button_desc: "In peacetime, owning at least one non-capital state in Tripoli allows us to choose its form of government. Each foundation begins a three-month handover shared by all regions."
 crb_can_found_tripoli_trigger: "We own non-capital land in Tripoli that can be organized, and the corresponding subject does not yet exist."
 crb_revenge.10.t: "The Future of Tripoli"
 crb_revenge.10.d: "The trading towns of the coast and the oases of the interior are linked by caravan trails. Merchants wish to entrust warehouses and markets to partners who know the region. Advocates of provincial rule propose a survey of the roads, fields, and tax registers."
 crb_revenge.10.f: "\"Shipowners know the harbors; camel drivers know every well.\""
 crb_revenge.10.a: "Establish the Tripolitanian Trading Post."
 crb_revenge.10.b: "Establish the Tripolitanian Province."
 crb_revenge.10.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_TRP_effect_tt: "Merchant contracts will connect desert caravans to seaports, opening warehouses to distant traders and sending a share of the busy markets' revenues to Carthage. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_TRP_effect_tt: "The governor's offices will take charge of the oases' and coastal towns' tax registers, appointing officials to inspect the caravan roads and bring their settlements under Carthaginian administration. The province pays #v 50%#! of its income."
 TRP: "Tripolitanian Trading Post"
 TRP_ADJ: "Tripolitanian"
 TRP_crb_province: "Tripolitanian Province"
 crb_found_numidia_post_button: "Organize Numidia"
 crb_found_numidia_post_button_desc: "In peacetime, owning at least one non-capital state in Numidia allows us to choose its form of government. Each foundation begins a three-month handover shared by all regions."
 crb_can_found_numidia_trigger: "We own non-capital land in Numidia that can be organized, and the corresponding subject does not yet exist."
 crb_revenge.11.t: "The Future of Numidia"
 crb_revenge.11.d: "Numidia's estates, markets, and inland settlements now adjoin our coast. Some would secure merchants and local notables through contracts. Others insist that only a governor's common tax registers can establish lasting order in the towns and pastures."
 crb_revenge.11.f: "\"Riders bring news from the interior; grain and account books arrive together at the gates.\""
 crb_revenge.11.a: "Establish the Numidian Trading Post."
 crb_revenge.11.b: "Establish the Numidian Province."
 crb_revenge.11.c: "Retain direct Carthaginian rule for now."
 crb_create_puppet_NUM_effect_tt: "Coastal warehouses will join the inland markets, merchants will manage estates and commerce, and Numidia's harvests will follow the trade roads to Carthage. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_NUM_effect_tt: "The governor will survey the fields and compile the tax rolls. Towns and inland settlements will answer to one administration, with inspectors upholding Carthaginian rule. The province pays #v 50%#! of its income."
