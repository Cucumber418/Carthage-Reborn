 CPS_DEF: "the Syrian Province"
 crb_territories.4.t: "Governing Syria"
 crb_territories.4.d: "Syria's towns and caravan roads link the coast to the east. Goods in the markets require dependable contracts, and settlements upon the roads require clear authority. Shall merchants manage a new trading post, or shall a governor arrive with the tax registers?"
 crb_territories.4.f: "\"The roads to the east have never belonged only to those who travel them.\""
 crb_territories.4.a: "Establish the Syrian Province."
 crb_territories.4.b: "Retain direct Carthaginian rule for now."
