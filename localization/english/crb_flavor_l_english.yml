l_english:
 crb_flavor.1.t: "The Oxhide of Byrsa"
 crb_flavor.1.d: "On Byrsa Hill, in the heart of Carthage, two households cannot agree upon the boundary of their land. Even the surveyor dispatched by the authorities has failed to settle the matter.\n\nAn elderly merchant has told the court an ancient story. When Queen Elissa arrived here from Tyre, the inhabitants offered her only as much land as an oxhide could cover. She cut the hide into thin strips and enclosed the entire hill."
 crb_flavor.1.f: "\"They bought a piece of land and enclosed it with an oxhide, and for this reason called it Byrsa.\"\n\n—Virgil, #italic Aeneid#!"
 crb_flavor.1.a: "Survey Byrsa again, as Queen Elissa would have done."
 crb_flavor.1.b: "The deeds shall decide the matter."
 crb_flavor.2.t: "The Phoenician Alphabet"
 crb_flavor.2.d: "The [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] have proposed that schools throughout the country teach the Punic alphabet. They argue that these letters passed from Tyre to Greece and thence throughout Europe, while the Carthaginians themselves have long forgotten how to write them.\n\nOpponents contend that this would merely burden children with another script they cannot use. With most of the population still unable to read, basic literacy must come first."
 crb_flavor.2.f: "\"The Greeks learned their letters from the Phoenicians, and the Romans learned theirs from the Greeks.\""
 crb_flavor.2.a: "Teach the Punic alphabet in our schools."
 crb_flavor.2.b: "First, let the children learn to read."
 crb_flavor.3.t: "Tyrian Purple"
 crb_flavor.3.d: "A dyer outside Carthage claims to have extracted ancient Tyrian purple from the murex shells found along the shore. The pigment was once said to be dearer than gold, and robes dyed with it were reserved for kings and senators.\n\nThe dyer seeks government support for his workshop. Several European collectors have also written to offer a handsome sum for all his samples."
 crb_flavor.3.f: "\"Ten thousand shellfish to dye a single robe.\""
 crb_flavor.3.a: "Fund the workshop and restore Tyrian purple."
 crb_flavor.3.b: "Supply the European collectors under a five-year contract."
 crb_flavor.4.t: "The Horse and the Palm"
 crb_flavor.4.d: "Workers repairing the old harbor have uncovered a clay pot beneath the foundations, filled with ancient coins. One face bears the head of a goddess; the other, a horse and a palm tree.\n\nTreasury officials propose melting down the coins to replenish the public purse. Others would use them as a model for a new issue, restoring the horse and the palm to Carthaginian money."
 crb_flavor.4.f: "\"It is said that a horse's head was found when Carthage's foundations were laid, foretelling a city famed for courage and might.\""
 crb_flavor.4.a: "Strike new coins after the ancient pattern."
 crb_flavor.4.b: "Recast the gold as new horse-and-palm coins."
 crb_flavor.5.t: "Mago's Treatise"
 crb_flavor.5.d: "A scholar has found fragments of Mago's agricultural treatise in an ancient library. Mago was the most celebrated agronomist of old Carthage. After capturing the city, the Romans gave its libraries to the kings of Numidia, but ordered that Mago's twenty-eight books be translated into Latin.\n\nThe [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] wish to have the fragments translated for distribution among the estates. A French agricultural society has offered to purchase the translation rights."
 crb_flavor.5.f: "\"He who buys a farm should sell his house in the city.\"\n\n—Mago of Carthage"
 crb_flavor.5.a: "Translate the treatise and distribute it among the estates."
 crb_flavor.5.b: "Sell the French five years of translation and publication rights."
 crb_flavor.6.t: "Punic Faith"
 crb_flavor.6.d: "At a recent diplomatic reception, a European ambassador remarked before the assembled guests that anyone signing a treaty with a Carthaginian should count his fingers afterward. In Latin, 'Punic faith' has always meant faithlessness.\n\nOur envoy left the reception at once. The foreign office now awaits the government's instructions."
 crb_flavor.6.f: "\"To the Romans, Carthaginian good faith meant no faith at all.\""
 crb_flavor.6.a: "Lodge a formal protest."
 crb_flavor.6.b: "Let our conduct prove our good faith."
 crb_flavor.7.t: "Carthage Must Be Destroyed"
 crb_flavor.7.d: "A Roman newspaper has printed a cartoon on its front page. An old man in a toga stands in the Senate, pointing to Carthage on a map. Beneath it are the words: 'Furthermore, I consider that Carthage must be destroyed.'\n\nThe newspaper soon reached Carthage. In the squares, citizens debate whether it is merely a jest or a threat."
 crb_flavor.7.f: "Whatever the subject under debate, Cato the Elder ended every speech in the Senate with the same words."
 crb_flavor.7.a: "Carthage shall not be destroyed a second time!"
 crb_flavor.7.b: "An ancient phrase cannot harm us."
 crb_flavor.8.t: "War Elephants"
 crb_flavor.8.d: "Several officers have submitted a plan to purchase elephants from Sudan and restore Carthage's elephant corps. Hannibal crossed the Alps with such beasts, they argue, and nothing could strike greater terror into the enemy.\n\nOthers on the general staff remain unconvinced. In an age of rifles and artillery, elephants would make excellent targets."
 crb_flavor.8.f: "\"Hannibal set out from New Carthage with thirty-seven elephants.\""
 crb_flavor.8.a: "Let the elephants march in our parades."
 crb_flavor.8.b: "This age calls for cannon, not elephants."
 crb_flavor.9.t: "Salammbô"
 crb_flavor.9.d: "The French author Gustave Flaubert has published #italic Salammbô#!, a novel set in ancient Carthage. It tells of the Mercenary War following the First Punic War and of Salammbô, daughter of Hamilcar Barca.\n\nThe book has become a sensation in Paris, bringing Carthage's name once more into European salons. Yet Carthaginian scholars object to its bloodshed and exotic spectacle, dismissing it as a French vision of an imagined Orient."
 crb_flavor.9.f: "\"It was at Megara, a suburb of Carthage, in the gardens of Hamilcar.\"\n\n—Gustave Flaubert, #italic Salammbô#!"
 crb_flavor.9.a: "Invite Monsieur Flaubert to see Carthage."
 crb_flavor.9.b: "This is the Carthage of the French imagination."
 crb_flavor.10.t: "A Wreck Beneath the Sea"
 crb_flavor.10.d: "While casting their nets offshore, fishermen recovered a length of ancient planking carved with Punic letters. Divers have since discovered the entire wreck, its hold still crowded with amphorae.\n\nThe [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] wish to raise the vessel and establish a museum in Carthage. European collectors have also arrived, bearing generous offers."
 crb_flavor.10.f: "\"The letters upon the planks are the shipwrights' marks. Following their numbers, they assembled the whole hull piece by piece.\""
 crb_flavor.10.a: "Build a museum and keep it in Carthage."
 crb_flavor.10.b: "Grant five years of salvage and exhibition rights."
 crb_flavor.11.t: "The Hundred and Four"
 crb_flavor.11.d: "A group of judges has petitioned the $RULER_TITLE_CRB_SUFETE$ to restore the ancient Council of the Hundred and Four. In old Carthage, this body investigated defeated generals, many of whom were put to death.\n\nThe judges call it the republic's traditional restraint upon the army. The [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] reply that no general wishes to fight both the enemy and the courts."
 crb_flavor.11.f: "\"Carthaginian generals feared the enemy in the field and the judges at home.\""
 crb_flavor.11.a: "Restore the Hundred and Four."
 crb_flavor.11.b: "The generals answer to the $RULER_TITLE_CRB_SUFETE$ alone."
 crb_flavor.12.t: "The Festival of Melqart"
 crb_flavor.12.d: "Each spring, Carthage honors Melqart, the patron god of Tyre. Ancient Carthage is said to have sent envoys to its mother city every year with offerings for his temple.\n\nThis year, the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] seek a grand procession, carrying the god's image from the old harbor to Byrsa Hill. Such a celebration would require considerable funds."
 crb_flavor.12.f: "\"Melqart, King of the City, dies in winter and returns in spring.\""
 crb_flavor.12.a: "Hold a grand procession."
 crb_flavor.12.b: "Keep to the customary celebrations."
 crb_flavor.13.t: "The Tin Route"
 crb_flavor.13.d: "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] have found an ancient sailing account. Long before the Romans arrived, Carthaginian ships passed the Pillars of Heracles and followed the Atlantic coast north to trade for tin in distant islands. Those islands are now known to lie in Britain.\n\nThe shipowners ask the government to negotiate a new trade agreement with the British. The [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] insist that Carthage's future lies upon African soil, not northern seas."
 crb_flavor.13.f: "\"A Carthaginian captain would sooner sink his ship than let the Romans follow him to the Tin Islands.\""
 crb_flavor.13.a: "Send an envoy to London."
 crb_flavor.13.b: "Carthage's future lies in Africa."
 crb_flavor.14.t: "Hannibal's Oath"
 crb_flavor.14.d: "In a temple of Tanit, an officer has brought his nine-year-old son before the altar to swear Hannibal's ancient oath: to remain Rome's enemy for the rest of his life.\n\nNews of the ceremony has spread through the city. Barcid newspapers praise the father, while senators fear that such rites will teach the next generation nothing but hatred."
 crb_flavor.14.f: "\"I swear never to be a friend of Rome.\"\n\n—Hannibal's oath"
 crb_flavor.14.a: "Let him swear the oath."
 crb_flavor.14.b: "A child should not inherit our hatred."
 crb_flavor.15.t: "The Legend of the Salt"
 crb_flavor.15.d: "A European historian has published an article arguing that no ancient work records the Romans sowing salt upon Carthage's soil after its capture. The tale, he suggests, was invented much later.\n\nThe article has caused an uproar in Carthage. The [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] urge respect for the historical record, while many citizens see an attempt to excuse the Romans."
 crb_flavor.15.f: "\"The Romans burned the city for seventeen days. The salt was added by later generations.\""
 crb_flavor.15.a: "History must rest upon evidence."
 crb_flavor.15.b: "Carthage remembers its suffering."
 crb_flavor.16.t: "Privateering"
 crb_flavor.16.d: "A Carthaginian privateer has seized a European merchantman in the Strait of Sicily and brought the ship and its cargo into port. The captain demands the customary division of the prize.\n\nThe merchantman's owner protests loudly at the consulate, declaring the Carthaginians no better than the Barbary corsairs."
 crb_flavor.16.f: "\"There are no frontiers at sea, only ships and wind.\""
 crb_flavor.16.a: "Let the privateers sail and divide the proceeds as usual."
 crb_flavor.16.b: "Release the ship. Carthage is no pirate haven."
