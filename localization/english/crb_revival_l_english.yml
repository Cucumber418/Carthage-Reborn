l_english:
 je_crb_cultural_revival: "Carthaginian Cultural Revival"
 je_crb_cultural_revival_lobby: "Revive the plantations, reclaim the lands said to have been salted by Rome, spread the worship of Tanit, and rebuild the Cothon upon the site of the ancient harbor."
 je_crb_cultural_revival_reason: "For two thousand years, Carthage's language, gods, and arts survived only in scattered villages and old families. Now that the republic has been reborn, senators and citizens alike believe that its revival must rest upon more than the sword. Crops must return to the fields, sacred fires to the temples, and ships to the harbor."
 crb_revival_status_default: "Complete all four works of restoration to secure the rebirth of Carthaginian culture."
 crb_revival_status_salt_in_progress: "Land reclamation has continued for [JournalEntry.GetCountry.MakeScope.Var('crb_salt_years').GetValue|v0] years. It will be completed after #v 10#! years."
 crb_revival_plantations_tt: "#b Revive the Plantations#!: Own at least #v 20#! plantation levels at home and overseas"
 crb_revival_salt_tt: "#b Reclaim the Salted Land#!: Research [GetTechnology('intensive_agriculture').GetName] and sustain reclamation for #v 10#! years"
 crb_revival_tanit_tt: "#b Restore the Old Gods#!: At least #v 80%#! of the population follows the [GetReligion('crb_tanit').GetName]"
 crb_revival_harbor_tt: "#b Rebuild the Harbor#!: Research [GetTechnology('reinforced_concrete').GetName] and complete the #b Cothon#! in Carthage"
 crb_salt_marsh_button: "Reclaim the Salted Land"
 crb_salt_marsh_button_desc: "Two thousand years ago, the Romans sowed salt upon our soil. Today we shall reclaim it. The work requires #v 10#! years of sustained expenditure."
 crb_owns_carthage_tt: "Own the state of #b Carthage#!"
 crb_revived_plantations: "Restored Plantations"
 crb_salt_reclamation: "Reclaiming the Salted Land"
 crb_salt_reclaimed: "The Salted Land Restored"
 crb_tanit_triumphant: "The Sacred Fire of Tanit"
 crb_cothon_rebuilt: "Cothon Rebuilt"
 crb_punic_revival: "Punic Revival"
 crb_punic_revival_desc: "The language, gods, and arts of Carthage flourish upon this soil once more."
 building_crb_cothon: "Cothon"
 building_crb_cothon_desc: "Ancient Carthage's naval harbor, the Cothon, consisted of a circular inner basin and a long outer harbor, with room for two hundred warships. It was destroyed with Carthage and sank beneath the waves."
 pmg_base_building_crb_cothon: "Base"
 pm_default_building_crb_cothon: "Cothon"
 crb_revival.1.t: "The Plantations Revived"
 crb_revival.1.d: "From the olive groves around Carthage to the overseas plantations, Punic estates flourish once more. Mago's agricultural treatise has been translated anew into Punic and circulates among the landholders.\n\nTwo thousand years ago, the Romans carried this work away to Rome. At last, it has come home."
 crb_revival.1.f: "\"He who wishes to buy land should first sell his house in the city, so that he will prefer to live in the countryside.\"\n\n—Mago, #italic On Agriculture#!"
 crb_revival.1.a: "Carthage's fields are fertile once more."
 crb_revival.2.t: "The Salted Land Restored"
 crb_revival.2.d: "Ten years of labor have borne fruit. The channels have been cleared, the salt washed away, and wheat grows again upon the barren land outside Carthage.\n\nThe old people say that no one has harvested these fields in two thousand years."
 crb_revival.2.f: "The Romans sowed salt here. We have reaped wheat."
 crb_revival.2.a: "This land was never truly dead."
 crb_revival.3.t: "The Sacred Fire of Tanit"
 crb_revival.3.d: "The great majority of our people have laid offerings before Tanit's temples. On the night of the new moon, sacred fires burned everywhere, from Carthage to the remotest villages.\n\nThe priests proclaim that the face of the goddess watches over her people once more."
 crb_revival.3.f: "\"To the Lady Tanit, the Face of Baal.\"\n\n—Inscription upon a stele in Carthage's Tophet"
 crb_revival.3.a: "The goddess is with us."
 crb_revival.4.t: "Cothon Rebuilt"
 crb_revival.4.d: "The new Cothon is complete. A command tower once more stands in the middle of the circular inner harbor, overlooking the entire basin. The engineers have used the latest reinforced concrete, but the harbor follows the form of its ancient predecessor.\n\nThe first ship to enter the inner harbor flies Carthage's flag."
 crb_revival.4.f: "\"The entrance was seventy feet wide and could be closed with chains. The outer harbor served merchantmen; the inner was reserved for warships.\"\n\n—Appian, #italic The Punic Wars#!"
 crb_revival.4.a: "Carthage has its harbor once more."
 crb_revival.5.t: "Plans for the Cothon"
 crb_revival.5.d: "The engineers have submitted a proposal to the Suffete. With modern reinforced concrete, the Cothon can be rebuilt upon the site of the ancient harbor.\n\nThe #b Cothon#! monument is now available for construction in Carthage."
 crb_revival.5.f: "What the ancients accomplished, we can accomplish too."
 crb_revival.5.a: "Let the planning begin."
 crb_revival.6.t: "The Revival of Carthage"
 crb_revival.6.d: "Fields, temples, and harbor have regained their former splendor. Punic is taught in the schools, Carthaginian history is performed in the theaters, and the young take pride in calling themselves Carthaginians.\n\nTwo thousand years ago, the Romans believed they had erased Carthage. They were mistaken."
 crb_revival.6.f: "Carthage has not fallen."
 crb_revival.6.a: "Carthage is reborn."
