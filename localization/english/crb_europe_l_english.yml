 crb_europe.11.t: "The Future of Belgica"
 crb_europe.11.d: "Belgica's towns stand beside waterways that carry vessels from inland workshops to the North Sea. Canals and river mouths bring merchants close to the houses of manufacturers, while the quays fill with goods awaiting another stage of their journey."
 crb_europe.11.f: "“Follow the canal long enough, and a workshop becomes a harbor.”"
