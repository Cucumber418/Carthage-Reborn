l_english:
 XLU: "Lusitanian Province"
 XLU_ADJ: "Lusitanian"
 XLU_crb_trading_post: "Lusitanian Trading Post"
 crb_europe.1.t: "The Future of Lusitania"
 crb_europe.1.d: "Atlantic winds carry the scent of salt into Lusitania's river ports. Shipwrights work beside the quays while inland estates send their produce toward the sea, and the leading families watch the arrival of Carthaginian merchants with interest."
 crb_europe.1.f: "“Beyond the headland lies another sea road, and another harbor waiting for a sail.”"
 crb_europe.1.a: "Establish the Lusitanian Trading Post."
 crb_europe.1.b: "Establish the Lusitanian Province."
 crb_europe.1.c: "Retain direct rule from Carthage for now."
 crb_found_lusitania_button: "Administer Lusitania"
 crb_found_lusitania_button_desc: "While at peace, one directly held non-capital state in Lusitania is enough to settle its administration. A foundation begins the shared three-month handover."
 crb_can_found_lusitania_trigger: "We hold non-capital land available for assignment in Lusitania, and its subject country does not yet exist."
 crb_create_puppet_XLU_tt: "Create the #v $XLU_crb_trading_post$#! as a [concept_crb_trading_post] of #v [ROOT.GetCountry.GetName]#!.\nTransfer our directly owned #v non-capital states#! in this region to the new subject."
 crb_create_puppet_XLU_effect_tt: "Salt pans, river quays and Atlantic shipyards will be linked by the merchants' contracts. Local traders will provision voyages and carry the interior's produce to the coast. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_XLU_tt: "Create the #v $XLU$#! as a [concept_crb_province] of #v [ROOT.GetCountry.GetName]#!.\nTransfer our directly owned #v non-capital states#! in this region to the new subject."
 crb_create_province_XLU_effect_tt: "The governor will register estates and salt works, inspect the river crossings and place the Atlantic ports within a common chain of offices. The province pays #v 50%#! of its income."
 crb_expand_XLU_post_button: "Expand the Lusitanian Trading Post"
 crb_expand_XLU_post_button_desc: "Transfer our directly held non-capital land in Lusitania, excluding states still being colonized, to the Lusitanian Trading Post. Only this subject's region is affected."
 crb_expand_XLU_post_button_effect_tt: "Transfer only our eligible non-capital land in Lusitania to the Lusitanian Trading Post. States being colonized, foreign land, the capital and other subjects' regions remain under their present rulers."
 crb_expand_XLU_province_button: "Expand the Lusitanian Province"
 crb_expand_XLU_province_button_desc: "Transfer our directly held non-capital land in Lusitania, excluding states still being colonized, to the Lusitanian Province. Only this subject's region is affected."
 crb_expand_XLU_province_button_effect_tt: "Transfer only our eligible non-capital land in Lusitania to the Lusitanian Province. States being colonized, foreign land, the capital and other subjects' regions remain under their present rulers."
 crb_provincialize_XLU_button: "Provincialize Lusitania"
 crb_provincialize_XLU_button_desc: "Atlantic warehouses and provisioning stations will become offices of the governor, whose inspectors will follow the rivers inland."
 crb_provincialize_XLU_button_effect_tt: "Convert the #v $XLU_crb_trading_post$#! into the #v $XLU$#! under a governor. Retain its territory, population, buildings, Treasury, army and current Liberty Desire; begin the shared #v 3#!-month handover across all regions."
 XET: "Etruscan Province"
 XET_ADJ: "Etruscan"
 XET_crb_trading_post: "Etruscan Trading Post"
 crb_europe.2.t: "The Future of Etruria"
 crb_europe.2.d: "The roads of Etruria pass between workshops, old city walls and cultivated hills. Town councils guard their privileges as carriers bring cloth and finished wares down to the Tyrrhenian ports, where unfamiliar sails are becoming a common sight."
 crb_europe.2.f: "“A city keeps its memory in stone, but its fortunes travel with the caravans.”"
 crb_europe.2.a: "Establish the Etruscan Trading Post."
 crb_europe.2.b: "Establish the Etruscan Province."
 crb_europe.2.c: "Retain direct rule from Carthage for now."
