 crb_europe.12.t: "The Future of Germania"
 crb_europe.12.d: "Along Germania's rivers, old market towns share the banks with growing workshops. Timber comes down from the forests and cargoes travel between inland districts, while the many local authorities watch the approaches to their bridges and gates."
 crb_europe.12.f: "“The river passes every boundary, carrying another town's goods.”"
