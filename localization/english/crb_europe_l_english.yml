 crb_create_puppet_XET_effect_tt: "Counting houses will connect the workshops, hill towns and Tyrrhenian quays. Craftsmen and merchants will bargain over cargoes beneath the familiar walls of their cities. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_XET_tt: "Create the #v $XET$#! as a [concept_crb_province] of #v [ROOT.GetCountry.GetName]#!.\nTransfer our directly owned #v non-capital states#! in this region to the new subject."
 crb_create_province_XET_effect_tt: "The governor will bring urban accounts and rural estates into common registers, sending officials along the roads between workshops, market towns and coastal harbors. The province pays #v 50%#! of its income."
 crb_expand_XET_post_button: "Expand the Etruscan Trading Post"
 crb_expand_XET_post_button_desc: "Transfer our directly held non-capital land in Etruria, excluding states still being colonized, to the Etruscan Trading Post. Only this subject's region is affected."
 crb_expand_XET_post_button_effect_tt: "Transfer only our eligible non-capital land in Etruria to the Etruscan Trading Post. States being colonized, foreign land, the capital and other subjects' regions remain under their present rulers."
 crb_expand_XET_province_button: "Expand the Etruscan Province"
 crb_expand_XET_province_button_desc: "Transfer our directly held non-capital land in Etruria, excluding states still being colonized, to the Etruscan Province. Only this subject's region is affected."
 crb_expand_XET_province_button_effect_tt: "Transfer only our eligible non-capital land in Etruria to the Etruscan Province. States being colonized, foreign land, the capital and other subjects' regions remain under their present rulers."
 crb_provincialize_XET_button: "Provincialize Etruria"
 crb_provincialize_XET_button_desc: "City registers and merchants' accounts will enter the governor's archives, while officials take their posts along the roads to the Tyrrhenian coast."
 crb_provincialize_XET_button_effect_tt: "Convert the #v $XET_crb_trading_post$#! into the #v $XET$#! under a governor. Retain its territory, population, buildings, Treasury, army and current Liberty Desire; begin the shared #v 3#!-month handover across all regions."
