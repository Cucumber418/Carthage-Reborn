 XPA: "Pannonian Province"
 XPA_ADJ: "Pannonian"
 XPA_crb_trading_post: "Pannonian Trading Post"
 crb_europe.9.t: "The Future of Pannonia"
 crb_europe.9.d: "On the Pannonian plain, horse fairs draw visitors from distant districts and grain moves toward the river landings. Beyond the market towns lie estates whose owners are accustomed to measuring the year by harvests, roads and the condition of the ferries."
 crb_europe.9.f: "“The plain is wide, but its roads converge at the river.”"
 crb_europe.9.a: "Establish the Pannonian Trading Post."
 crb_europe.9.b: "Establish the Pannonian Province."
 crb_europe.9.c: "Retain direct rule from Carthage for now."
 crb_found_pannonia_button: "Administer Pannonia"
 crb_found_pannonia_button_desc: "While at peace, one directly held non-capital state in Pannonia is enough to settle its administration. A foundation begins the shared three-month handover."
 crb_can_found_pannonia_trigger: "We hold non-capital land available for assignment in Pannonia, and its subject country does not yet exist."
 crb_create_puppet_XPA_tt: "Create the #v $XPA_crb_trading_post$#! as a [concept_crb_trading_post] of #v [ROOT.GetCountry.GetName]#!.\nTransfer our directly owned #v non-capital states#! in this region to the new subject."
 crb_create_puppet_XPA_effect_tt: "Merchants will carry grain from the estates to river warehouses, supply the horse fairs and arrange passage between the markets scattered across the plain. The trading post pays #v 30%#! of its income, and the merchants will bring Tanit's altars to the region."
 crb_create_province_XPA_tt: "Create the #v $XPA$#! as a [concept_crb_province] of #v [ROOT.GetCountry.GetName]#!.\nTransfer our directly owned #v non-capital states#! in this region to the new subject."
 crb_create_province_XPA_effect_tt: "The governor will register estates and market towns, inspect the river landings and appoint officials to connect the districts of the Pannonian plain. The province pays #v 50%#! of its income."
