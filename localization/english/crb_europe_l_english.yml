 crb_europe.10.t: "The Future of Noricum"
 crb_europe.10.d: "The valleys of Noricum ring with the work of mines and iron forges. Carriers climb toward the passes with loaded animals, and the settlements below depend as much on open mountain roads as on the ore beneath their feet."
 crb_europe.10.f: "“A closed pass is felt in every workshop below it.”"
