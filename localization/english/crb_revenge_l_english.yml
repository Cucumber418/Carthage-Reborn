 je_crb_punic_war: "[GetPlayer.GetCustom('crb_punic_war_ordinal')] Punic War"
 je_crb_punic_war_concluded: "Punic War"
 je_crb_punic_war_reason: "Carthage is again at war with the rulers of Sicily. Three Punic Wars ended in Carthaginian defeat. This time, its people are determined to recover the island."
 crb_punic_war_mobilize_button: "Rally the Citizens"
 crb_punic_war_mobilize_button_desc: "Proclaim the cause of war in the squares and call upon the citizens to fight for Carthage."
 crb_punic_war_mobilize_cooldown_tt: "The citizens have not been rallied in the past year"
 crb_punic_war_mobilize_support_tt: "Our [concept_war_support] increases by #v 5#! in every war"
 crb_punic_war_pledge_button: "The Senate's Pledge"
 crb_punic_war_pledge_button_desc: "The Senate publicly pledges that this time it will not abandon the generals at the front."
 crb_punic_war_pledge_cooldown_tt: "The Senate has not made a pledge in the past two years"
 crb_punic_war_mobilization: "Citizens Rallied"
 crb_senate_war_pledge: "The Senate's Pledge"
 crb_punic_war_victory: "Victory in the Punic War"
 crb_punic_war.1.t: "[ROOT.GetCountry.GetCustom('crb_punic_war_ordinal')] Punic War"
 crb_punic_war.1.d: "War has begun. Carthage faces the rulers of Sicily, the island that once cost its people three wars.\n\nIn the Popular Assembly, a speaker has recited the names of the Punic Wars. The crowd in the square answered with the next name: [ROOT.GetCountry.GetCustom('crb_punic_war_ordinal')] Punic War."
 crb_punic_war.1.f: "\"Carthage lost the first war in Sicily, the second in Italy, and the third in Africa. This time, we shall win it back in Sicily.\""
 crb_punic_war.1.a: "For Carthage!"
 crb_punic_war.2.t: "Sicily Belongs to Carthage"
 crb_punic_war.2.d: "The whole of Sicily is in Carthaginian hands. From Ziz to Syracuse, its banners fly above every city's walls.\n\nThe generals propose pressing the advantage and taking Sardinia and Kyrnos as well. The senators warn that the great powers have begun to notice Carthage's expansion."
 crb_punic_war.2.f: "This time, Rome found no Scipio."
 crb_punic_war.2.a: "We have won enough."
 crb_punic_war.2.b: "Sardinia and Kyrnos shall be ours as well."
 crb_punic_war.3.t: "Another Punic Defeat"
 crb_punic_war.3.d: "The war is over, and Sicily remains beyond Carthage's grasp. The returning soldiers pass silently through the gates. There are no cheers in the squares.\n\nYet the Carthaginians remember how, after defeat in the First Punic War, Hannibal's father brought his young son before an altar to swear an oath."
 crb_punic_war.3.f: "Defeat is only the prelude to another war."
 crb_punic_war.3.a: "We shall return."
 je_crb_revenge_road: "Two Thousand Years of Vengeance"
 je_crb_revenge_road_lobby: "After reestablishing New Carthage, follow Hannibal's footsteps over the Pyrenees and the Alps to take vengeance upon Rome."
 je_crb_revenge_road_reason: "Two thousand years ago, Hannibal marched from New Carthage with his army and elephants, crossed the Pyrenees and the Rhône, and passed over the Alps. In Italy he defeated Roman legion after Roman legion. He came close to taking Rome itself.\n\nNow Carthage stands in New Carthage once more. The road remains."
 crb_revenge_status_0: "Select #b Across the Pyrenees!#! below to begin following Hannibal's road."
 crb_revenge_status_1: "After securing Spain's Mediterranean coast, you may #b Cross Gaul!#!"
 crb_revenge_status_2: "After securing Hannibal's route through Gaul, you may march #b Across the Alps!#!"
 crb_revenge_status_3: "After securing the lands on both sides of the Alps, #b Vengeance#! may begin."
 crb_revenge_status_4: "Take Rome and end the war to complete your vengeance."
 crb_revenge_status_5: "Vengeance is complete. Carthage's newly acquired lands may still be organized as trading posts or provinces."
 crb_punic_war_over_tt: "No longer confronting or at war with a country holding land in Sicily"
 crb_revenge_rome_taken_tt: "Carthage or its puppets and trading posts own all of #b Lazio#! (Rome)"
 crb_revenge_stage1_lands_tt: "Carthage or its puppets and trading posts own all of #b Catalonia#!, #b Valencia#!, #b Murcia#!, #b Upper Andalusia#!, and #b Lower Andalusia#!"
 crb_revenge_stage2_lands_tt: "Carthage or its puppets and trading posts own all of #b Languedoc#!, #b Provence#!, and #b Rhône#!"
 crb_revenge_stage3_lands_tt: "Carthage or its puppets and trading posts own all of #b Switzerland#!, #b Savoy#!, #b Piedmont#!, #b Lombardy#!, and #b Venetia#!"
 crb_revenge_stage4_lands_tt: "Carthage or its puppets and trading posts own every region of mainland Italy and Sardinia"
 crb_revenge_loyalty: "Loyal to the Republic"
 crb_revenge_complete: "Two Thousand Years of Vengeance"
 crb_revenge_complete_desc: "The Romans once declared that Carthage must be destroyed. Now Carthage's banner flies above the Capitoline Hill."
 crb_revenge_stage1_button: "Across the Pyrenees!"
 crb_revenge_stage1_button_desc: "Hannibal's campaign began at New Carthage and followed the Iberian coast north."
 crb_revenge_stage2_button: "Cross Gaul!"
 crb_revenge_stage2_button_desc: "After crossing the Pyrenees, Hannibal passed through southern Gaul and crossed the Rhône."
 crb_revenge_stage3_button: "Across the Alps!"
 crb_revenge_stage3_button_desc: "In the late autumn of 218 BC, Hannibal led his army and elephants over the Alps."
 crb_revenge_stage4_button: "Vengeance Begins!"
 crb_revenge_stage4_button_desc: "The Alps are behind us. Rome lies ahead."
 crb_expand_trading_posts_decision: "Expand the Trading Posts"
 crb_expand_trading_posts_decision_desc: "Entrust newly acquired non-capital land to the corresponding trading post or province."
 crb_expand_trading_posts_decision_tooltip: "Transfer new land within each region to its actual subject."
 crb_can_expand_trading_posts_tt: "We own transferable non-capital states within the regions of our actual subjects that are not being colonized"
 crb_expand_trading_posts_effect_tt: "Transfer directly owned non-capital states that are not being colonized to the existing trading post or province in each region. Carthage's homeland, Sicily, the current capital, and states being colonized are retained."
 crb_convert_to_islam_decision: "Convert to Islam"
 crb_convert_to_islam_decision_desc: "To survive upon this soil, our Suffetes must lead the way in adopting the faith of our neighbors..."
 crb_convert_to_islam_decision_tooltip: "Adopt the Islamic denomination with the most followers in our country as the State Religion."
 crb_islam_share_tt: "More than #v 40%#! of our population follows Islam"
 crb_converted_to_islam: "Tanit Forsaken"
 crb_carthaginian_protection: "Carthage's Protection"
 crb_carthaginian_hegemony: "Carthaginian Hegemony"
 crb_revenge.0.t: "Hannibal's Road"
 crb_revenge.0.d: "Carthaginian ships crowd the harbor of New Carthage. Upon the hills beyond the city, veterans point north: this is where Hannibal began.\n\nIn the Popular Assembly, ever more voices speak of the road ahead. The Pyrenees, the Rhône, the Alps, and then Rome."
 crb_revenge.0.f: "\"We shall either find a way or make one.\""
 crb_revenge.0.a: "The road remains."
 crb_revenge.1.t: "Across the Pyrenees!"
 crb_revenge.1.d: "The generals have drawn the first leg of the route upon their maps: north from New Carthage along Iberia's Mediterranean coast to the foot of the Pyrenees.\n\nThe senators fear that reviving the ancestral frontiers will alarm neighboring courts and cast doubt upon old agreements. The generals reply that Hannibal never waited for permission."
 crb_revenge.1.f: "In the spring of 218 BC, Hannibal left New Carthage with ninety thousand infantry, twelve thousand cavalry, and thirty-seven elephants."
 crb_revenge.1.a: "Claim Spain's Mediterranean coast."
 crb_revenge.1.b: "Consolidate at home before making claims."
 crb_revenge.2.t: "Cross Gaul!"
 crb_revenge.2.d: "The Pyrenees are behind us. Ahead lie the plains of southern Gaul and the rushing Rhône. Hannibal once ferried his elephants over this river upon rafts. Today, reports from the riverside towns cover the generals' tables as they turn again to the old accounts of that crossing."
 crb_revenge.2.f: "\"The elephants were driven onto rafts covered with earth, believing that they still stood upon dry ground.\"\n\n—Polybius, #italic Histories#!"
 crb_revenge.2.a: "Claim Hannibal's route through Gaul."
 crb_revenge.2.b: "Consolidate at home before making claims."
 crb_revenge.3.t: "Across the Alps!"
 crb_revenge.3.d: "Gaul is in our hands, and the Alps rise before us. Hannibal crossed these snowy mountains in late autumn, losing nearly half his army, but reaching Italy nonetheless.\n\nToday we have railways and telegraphs, yet the mountains remain. Other sovereigns guard the passes, and the snow upon the old roads remembers none of those ancient banners."
 crb_revenge.3.f: "\"You are crossing not merely the walls of Italy, but the walls of Rome itself.\"\n\n—Hannibal, in Livy's #italic History of Rome#!"
 crb_revenge.3.a: "Claim Switzerland and northern Italy."
 crb_revenge.3.b: "Consolidate at home before making claims."
 crb_revenge.4.t: "Vengeance Begins!"
 crb_revenge.4.d: "The Alps are behind us. From here the road runs south to Rome. Two thousand years ago, Hannibal stood before its walls but did not attack.\n\nThe officers gather around their maps of Italy, debating the roads to the Tiber. In the Popular Assembly, Hannibal's name once more rises above every other voice."
 crb_revenge.4.f: "\"Hannibal, you know how to win a victory, but not how to use it.\"\n\n—Maharbal, in Livy's #italic History of Rome#!"
 crb_revenge.4.a: "Claim the whole of Italy."
 crb_revenge.4.b: "Consolidate at home before making claims."
 crb_revenge.9.t: "Vengeance Fulfilled!"
 crb_revenge.9.d: "Rome belongs to Carthage, and the war is over. Two thousand years ago, the Romans burned Carthage, salted its ruins, and declared that the city would never rise again.\n\nToday, Carthage's Suffete stands upon the Capitoline Hill."
 crb_revenge.9.f: "Carthage has not fallen."
 crb_revenge.9.a: "Two thousand years of vengeance, at last fulfilled."
 crb_carthaginian_protection_desc: "Carthage offers its new possessions limited political protection: an additional -0.05 to weekly Liberty Desire change and -5% to its rate of increase. Final changes are still calculated by the normal subject mechanics."
 crb_carthaginian_hegemony_desc: "Carthage maintains its ties to its overseas possessions, providing an additional -0.02 to each subject's weekly Liberty Desire change."
