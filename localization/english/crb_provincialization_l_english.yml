l_english:
 crb_provincialize_TRP_button: "Provincialize Tripoli"
 crb_provincialize_TRP_button_desc: "The coastal trading towns' manifests will join the governor's tax registers. Officials will inspect both the desert trade routes and the ports."
 crb_provincialize_NUM_button: "Provincialize Numidia"
 crb_provincialize_NUM_button_desc: "Inland tribes and coastal towns will enter a common register, while the governor's officials inspect the valleys and pastures."
 crb_provincialize_IBT_button: "Provincialize Iberia"
 crb_provincialize_IBT_button_desc: "Mines, vineyards, and seaports will enter a common tax register. The trading houses' counting rooms will become the governor's offices."
 crb_provincialize_GLT_button: "Provincialize Gaul"
 crb_provincialize_GLT_button_desc: "The governor will inspect the towns of the Rhône valley. Port contracts will give way to taxes and registers extending into the interior."
 crb_provincialize_SNT_button: "Provincialize the Alps"
 crb_provincialize_SNT_button_desc: "Passes and valley settlements will come under one governor. The post roads will link tax officials and garrisons across the mountains."
 crb_provincialize_IOP_button: "Provincialize Rome"
 crb_provincialize_IOP_button_desc: "The Ionian Trading Post will become the Roman Province. The governor's offices will register taxes and appoint officials throughout southern Italy's ports and countryside."
 crb_provincialize_CPM_button: "Provincialize Mauretania"
 crb_provincialize_CPM_button_desc: "Atlantic trading towns and mountain tribes will come within the governor's jurisdiction. Caravan stations will also serve the province's inspectors."
 crb_provincialize_CPE_button: "Provincialize Egypt"
 crb_provincialize_CPE_button_desc: "The governor's offices will register the Nile's fields, granaries, and canals. The river ports' counting rooms will collect taxes for the whole valley."
 crb_provincialize_CPF_button: "Provincialize Phoenicia"
 crb_provincialize_CPF_button_desc: "The merchants' chambers of Tyre and Sidon will answer to the governor. The coast's tax registers and official appointments will be brought under one authority."
 crb_provincialize_CPS_button: "Provincialize Syria"
 crb_provincialize_CPS_button_desc: "Coastal trading towns and inland caravan routes will form one jurisdiction. The governor's inspectors will follow the old merchant roads into each city."
 crb_provincialize_CPB_button: "Provincialize Mesopotamia"
 crb_provincialize_CPB_button_desc: "Canals, fields, and granaries between the two rivers will enter the governor's registers. Tax officials will take their posts at the merchants' crossings."
 crb_provincialize_CPA_button: "Provincialize Arabia"
 crb_provincialize_CPA_button_desc: "The governor's administration will link oases, caravan stations, and seaports. Local chiefs will report their households and revenues to its officials."
 crb_provincialize_post_required_tt: "This country remains a direct Carthaginian trading post and has not become a province."
 crb_provincialize_destination_ready_tt: "The corresponding province does not already exist as a separate country."
 crb_provincialize_territory_effect_tt: "Convert the existing trading post into a province, retaining its territory, population, buildings, Treasury, and military. The governor's offices will take charge of the tax registers and local appointments. Payments rise from 30% to 50% of income, and the trading post's trade and port privileges end."
