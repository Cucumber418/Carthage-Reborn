l_english:
 concept_crb_trading_post: "Trading Post"
 concept_crb_trading_post_desc: "$subject_type_crb_trading_post_desc$"
 concept_crb_province: "Province"
 concept_crb_province_desc: "$subject_type_crb_province_desc$"
 subject_type_crb_trading_post: "$concept_crb_trading_post$"
 subject_type_crb_trading_post_no_icon: "$concept_crb_trading_post$"
 subject_type_crb_province: "$concept_crb_province$"
 subject_type_crb_province_no_icon: "$concept_crb_province$"
 crb_trading_post: "$concept_crb_trading_post$"
 crb_trading_post_action_name: "$crb_trading_post$"
 crb_trading_post_action_propose_name: "Establish Trading Post"
 crb_trading_post_action_break_name: "Grant Independence"
 crb_trading_post_action_ask_to_break_name: "Demand Independence"
 crb_trading_post_desc: "$subject_type_crb_trading_post_desc$"
 crb_trading_post_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a trading post of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName].\n\n$subject_type_crb_trading_post_desc$"
 crb_trading_post_action_notification_name: "Demand to Establish Trading Post"
 crb_trading_post_action_notification_desc: "[INITIATOR_COUNTRY.GetName] demands our submission as a trading post."
 crb_trading_post_action_notification_break_name: "Independence Granted"
 crb_trading_post_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has ended our trading post status. We are independent once more."
 crb_province: "$concept_crb_province$"
 crb_province_action_name: "$crb_province$"
 crb_province_action_propose_name: "Establish Province"
 crb_province_action_break_name: "Grant Independence"
 crb_province_action_ask_to_break_name: "Demand Independence"
 crb_province_desc: "$subject_type_crb_province_desc$"
 crb_province_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a province of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName].\n\n$subject_type_crb_province_desc$"
 crb_province_action_notification_name: "Demand to Establish Province"
 crb_province_action_notification_desc: "[INITIATOR_COUNTRY.GetName] demands our submission as a province."
 crb_province_action_notification_break_name: "Independence Granted"
 crb_province_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has ended our provincial status. We are independent once more."
 subject_type_crb_trading_post_desc: "A trading post is an overseas commercial settlement administered by a governor on behalf of Carthage. Merchants bind its ports, markets, and distant suppliers through their contracts. It enjoys trade and port privileges and pays 30% of its income to Carthage. It cannot start its own Diplomatic Plays and joins its overlord's wars."
 subject_type_crb_province_desc: "A province is ruled by a governor appointed by Carthage. Tax officials survey the fields and compile population registers, while administrators and inspectors bring local affairs under the governor's authority. It pays 50% of its income to Carthage, cannot start its own Diplomatic Plays, and joins its overlord's wars."
