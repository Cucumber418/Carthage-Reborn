l_english:
 TUN: "Punic State"
 TUN_ADJ: "Punic"
 dyn_c_tunisia: "Punic State"
 TUN_FLAVOR_TEXT: "Two thousand years ago, Rome declared that Carthage would never rise again. Now the Punic people have reopened the Senate beside the ruins of the old city. Carthage is reborn. With senators and generals at odds, and powerful neighbors on every frontier, can it once more command the Mediterranean?"
