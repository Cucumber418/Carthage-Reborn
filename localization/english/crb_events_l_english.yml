 crb_popular_assembly_restored: "Popular Assembly Restored"
 crb_popular_assembly_restored_desc: "The Popular Assembly has regained the power to decide war and peace. Soldiers and citizens now hold the republic in their hands."
 crb_senate_peace: "The Senate's Peace"
 crb_senate_peace_desc: "The Senate holds the republic firmly in its grasp. Carthage will win the world's respect through merchant shipping rather than fleets of war."
 crb_hb_barca_betrayed: "Barcids Betrayed"
 crb_hb_hanno_betrayed: "Hannonids Betrayed"
 crb_hanno_barca.1.t: "The Senate and the Assembly"
 crb_hanno_barca.1.d: "Carthage's army has returned in triumph. It is the first Punic victory in two thousand years, and the returning soldiers and cheering citizens are no longer content to let the senators decide their fate. In the squares of Carthage, people speak once more of the ancient Popular Assembly and of the Barcid family, who led their ancestors over the Alps.\n\nThe Senate's Hannonids view these developments with alarm. In their eyes, Carthage must rise through estates and merchant shipping, not an endless succession of campaigns. The struggle between the two factions will decide the republic's future."
 crb_hanno_barca.1.f: "\"The Carthaginian state reached its greatest strength earlier, and therefore began its decline earlier. By the time of the Hannibalic War, the people had gained the greatest voice in deliberation, while at Rome the Senate still held sway.\"\n\n—Polybius, #italic Histories#!"
 crb_hanno_barca.1.a: "This dispute will decide Carthage's course."
 crb_hanno_barca.2.t: "The Barcids Prevail"
 crb_hanno_barca.2.d: "The Senate has finally yielded. The Popular Assembly has regained the right to decide war and peace, and representatives of soldiers and citizens have entered chambers once reserved for the great families.\n\nIn the streets of Carthage, the crowds cry out Hannibal's name. To them, this is only the beginning. The lands lost two thousand years ago await the return of the Carthaginians."
 crb_hanno_barca.2.f: "\"I swear that, as soon as my age permits, I shall be Rome's enemy with fire and sword.\"\n\n—Hannibal Barca"
 crb_hanno_barca.2.a: "Carthage's legions shall march again!"
 crb_hanno_barca.3.t: "The Hannonids Prevail"
 crb_hanno_barca.3.d: "The demands of the Popular Assembly have grown quiet. With caution and patience, the senators have won the struggle. The republic remains in the hands of its foremost families.\n\nThe Hannonids believe that Carthage's future lies in fertile fields and trade routes stretching across the seas. Let the poets sing of distant campaigns."
 crb_hanno_barca.3.f: "\"I think we should keep this young man at home, where he may learn obedience to the laws and how to live on equal terms with others.\"\n\n—Hanno the Great, in Livy's #italic History of Rome#!"
 crb_hanno_barca.3.a: "Prudence is the republic's virtue."
 crb_hanno_barca.4.t: "The Republic Must Choose"
 crb_hanno_barca.4.d: "The factional struggle has lasted three years, yet neither the Senate nor the Popular Assembly has secured a majority strong enough to settle it. Foreign envoys mock Carthage for having two governments and no one capable of governing.\n\nOutside the chamber, citizens crowd the square awaiting a decision. Messengers from both factions come and go from the Suffetes' residence, carrying their demands and unsigned letters of warning."
 crb_hanno_barca.4.f: "\"The Carthaginians are thought to possess an excellent constitution... The people have always remained loyal to it; there has been no civil strife worthy of mention, nor has any tyrant arisen.\"\n\n—Aristotle, #italic Politics#!"
 crb_hanno_barca.4.a: "Stand with the Popular Assembly."
 crb_hanno_barca.4.b: "Stand with the Senate."
 crb_hanno_barca.5.t: "Hannibal's Heir"
 crb_hanno_barca.5.d: "A claim is spreading through the barracks: ancient Carthage once had kings of its own, and a true restoration demands a monarch capable of uniting the Punic people.\n\nAn officer named [SCOPE.sCharacter('crb_royalist_agitator').GetFullName] is advancing this cause among soldiers and citizens. His speeches draw ever larger audiences."
 crb_hanno_barca.5.f: "The republic gave us a debating chamber. The chamber has never won us a war."
 crb_hanno_barca.5.a: "Let him speak."
 crb_hb_veterans_bounty_effect_tt: "Treasury: @money!#n [ROOT.GetCountry.MakeScope.ScriptValue('crb_hb_veterans_bounty_cost')|D]#!."
