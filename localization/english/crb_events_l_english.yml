l_english:
 crb_carthage.1.t: "Carthage Has Not Fallen..."
 crb_carthage.1.d: "One thousand nine hundred and eighty-one years ago, the Romans burned Carthage, ploughed salt into its ruins, and declared that the city would never rise again. Yet along the coasts and in the villages of Tunisia, the Punic language, gods, and family names never entirely disappeared.\n\nNow senators claiming descent from Hanno and Barca have reopened the Senate beside the ruins of the old city and proclaimed the rebirth of Carthage. The great powers pay them little heed, while neighboring states watch with hungry eyes. The republic must first recover Constantine or Tripoli. Whichever falls first will force the Senate and the Popular Assembly into an open contest over Carthage's future. Upon this once-accursed soil, the young [ROOT.GetCountry.GetName] must prove to the world that Carthage has not fallen."
 crb_carthage.1.f: "\"Furthermore, I consider that Carthage must be destroyed.\"\n\n—Marcus Porcius Cato"
 crb_carthage.1.a: "The Senate shall guard Carthage."
 crb_carthage.1.b: "The people shall rebuild Carthage."
 crb_carthago_non_deleta: "Carthage Has Not Fallen"
 crb_carthago_non_deleta_desc: "The Romans declared that Carthage would never rise again. Until the great powers recognize us, every merchant vessel upon the Mediterranean may be counted among our prizes."
 crb_tanit_temples_reopened: "Temples of Tanit Reopened"
 crb_tanit_temples_reopened_desc: "Sacred fires burn once more in temples silent for two thousand years. The priesthood holds considerable influence in the newborn republic."
 crb_senate_will_guard: "The Senate's Protection"
 crb_people_will_rebuild: "Rebuilding by the People"
 je_group_crb_carthage: "Carthage"
 je_crb_hanno_barca: "The Hannonids and the Barcids"
 je_crb_hanno_barca_lobby: "The capture of Constantine or Tripoli will bring the Senate's Hannonids into conflict with the Barcids, supported by the army and the people. The Barcids favor overseas expansion; the Hannonids would preserve the estates and the trade routes."
 je_crb_hanno_barca_reason: "Two great factions long shaped the politics of ancient Carthage. Senators led by the Hannonids sought to preserve Africa's estates and maritime trade, avoiding war with powerful states. Generals led by the Barcids drew support from soldiers and citizens and demanded expansion overseas. Two thousand years later, the reborn Carthage has inherited their dispute.\n$TOOLTIP_DELIMITER$\n@information!The #b Hannonids#! comprise the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName], and [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]. They defend the established order and support [GetLawType('law_oligarchy').GetName], [GetLawType('law_hereditary_bureaucrats').GetName], and [GetLawType('law_mercantilism').GetName].\n\nThe #b Barcids#! comprise the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName], [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName], and [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]. They seek to restore the Popular Assembly and support [GetLawType('law_wealth_voting').GetName], [GetLawType('law_elected_bureaucrats').GetName], and [GetLawType('law_protectionism').GetName]. If necessary, they would even acclaim a national monarch to recover the lands lost in the Punic Wars."
 crb_hb_claims_taken_tt: "Carthage or one of its actual subjects owns land in Constantine or Tripoli"
