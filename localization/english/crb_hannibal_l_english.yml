l_english:
 je_crb_hannibal_returns: "Hannibal Returns"
 je_crb_hannibal_returns_lobby: "If the Barcids win the factional struggle, Carthage will seek to recover its dominions before the Punic Wars: from Tripoli to Iberia, from Sicily to ancient Tyre."
 je_crb_hannibal_returns_reason: "The Popular Assembly has decided: Carthage shall recover the lands of its ancestors. From the African coast to the cities of Sicily, from the Mediterranean islands to Iberia's silver mines, every land once held by Carthage awaits its return."
 crb_hannibal_tripoli_tt: "#b Infiltration: Tripoli#!: Carthage or its actual subjects control all of Tripoli and Cyrenaica"
 crb_hannibal_numidia_tt: "#b Conquest: Numidia#!: Carthage or its actual subjects control all of Algiers, Constantine, and Oran"
 crb_hannibal_syracuse_tt: "#b Return: Syracuse#!: Carthage or its actual subjects control all of Sicily"
 crb_hannibal_islands_tt: "#b Annexation: The Mediterranean Islands#!: Carthage or its actual subjects control the Balearic Islands, Malta, Crete, and Cyprus"
 crb_hannibal_iberia_tt: "#b Recovery: Iberia#!: Carthage or its actual subjects control all of Lower Andalusia"
 crb_hannibal_new_carthage_tt: "#b Revival: New Carthage#!: Carthage and its actual subjects together own at least #v 3#! states in mainland Spain"
 crb_hannibal_tyre_tt: "#b Homecoming: The Ancestral Throne#!: Carthage or its actual subjects own land in Lebanon"
 crb_hannibal_triumph: "Hannibal's Triumph"
 crb_hannibal_stability: "Consolidated Rule"
 crb_rapid_integration: "Rapid Incorporation"
 crb_mediterranean_islands: "Masters of the Mediterranean Islands"
 crb_ancestral_throne: "The Ancestral Throne"
 crb_ancestral_throne_desc: "The Carthaginians have returned to the city from which Queen Elissa set sail."
 crb_hannibal_returned: "Hannibal Returns"
 crb_hannibal.0.t: "Hannibal Returns"
 crb_hannibal.0.d: "By an overwhelming majority, the Popular Assembly has resolved to recover every Carthaginian possession held before the Punic Wars.\n\nIn Carthage's squares, the people call this day 'Hannibal's return.' The generals have marked their objectives upon the map: Tripoli, Numidia, Sicily, the Mediterranean islands, Iberia, and Tyre, the oldest homeland of the Carthaginians. Merchant ships carry the news across the sea, while foreign envoys hurry to write to their courts."
 crb_hannibal.0.f: "\"We shall either find a way or make one.\"\n\n—Attributed to Hannibal"
 crb_hannibal.0.a: "Legions of Carthage, march!"
 crb_hannibal.1.t: "Infiltration: Tripoli"
 crb_hannibal.1.d: "The merchant ports along the Gulf of Sidra fly Carthage's flag once more. Two thousand years ago, Leptis Magna, Oea, and Sabratha paid tribute to Carthage. Now Tripoli and Cyrenaica have returned to the republic's sphere.\n\nThe Senate will settle the government of these new lands in due course. For now, the Popular Assembly salutes its victorious soldiers."
 crb_hannibal.1.f: "The trade routes of Emporia lead deep into the desert, where gold, ivory, and slaves await."
 crb_hannibal.1.a: "Establish a trading post to guard our eastern frontier."
 crb_hannibal.1.c: "Follow Rome's example and send a governor to Tripoli."
 crb_hannibal.2.t: "Conquest: Numidia"
 crb_hannibal.2.d: "Algiers, Constantine, and Oran are in Carthage's hands. Ancient Numidia is joined to the republic once more, and senators are already looking farther west, toward Morocco.\n\nWe must consolidate our gains and prepare for the next campaign."
 crb_hannibal.2.f: "\"Where the Numidian cavalry stands, there stands victory.\""
 crb_hannibal.2.a: "Restore Numidia under a king of our choosing."
 crb_hannibal.2.c: "Follow Rome's example and make Numidia a province."
 crb_hannibal.3.t: "Return: Syracuse"
 crb_hannibal.3.d: "Sicily has at last returned to Carthaginian hands. Across three Punic Wars, Carthage shed too much blood for this island. Now its banners fly from the walls of Ziz and Syracuse alike.\n\nGrain ships sail for Africa once more, and officials begin to put the scattered tax registers in order. Old battlefields still lie among the villages, while merchants returning to the ports already speak of next season's harvest."
 crb_hannibal.3.f: "Sicily is the stepping stone between Carthage and Rome. Whoever holds it holds the key to the Mediterranean."
 crb_hannibal.3.a: "Incorporate Sicily without delay, whatever the cost."
 crb_hannibal.3.b: "Proceed steadily and consolidate our rule."
 crb_hannibal.4.t: "Annexation: The Mediterranean Islands"
 crb_hannibal.4.d: "From Iboshim to Kition, the Mediterranean islands belong to Carthage. Once waystations for Phoenician merchantmen, they again provide harbors for the Carthaginian fleet."
 crb_hannibal.4.f: "The sea is the Carthaginians' field."
 crb_hannibal.4.a: "The Mediterranean is once more a Punic sea."
 crb_hannibal.5.t: "Recovery: Iberia"
 crb_hannibal.5.d: "Gadir, the oldest Phoenician city in the west, has returned to Punic hands. From its shore one can see the Pillars of Heracles, known to the ancient Punic sailors as the Pillars of Melqart.\n\nFrom here, Carthage can advance once more into the Iberian interior."
 crb_hannibal.5.f: "Beyond the Pillars of Melqart lies the ocean the Carthaginians called their own."
 crb_hannibal.5.a: "Incorporate Gadir without delay."
 crb_hannibal.5.b: "Proceed steadily and consolidate our rule."
 crb_hannibal.6.t: "Revival: New Carthage"
 crb_hannibal.6.d: "Carthaginians have returned to Iberia's harbors and roads. Ancient New Carthage was the center of the Barcids' overseas dominions and the starting point of Hannibal's campaign.\n\nThe Popular Assembly celebrates this achievement. Whether these lands will be governed as a trading post, a province, or a direct possession of the republic will be settled separately."
 crb_hannibal.6.f: "\"Iberian silver paid for Hannibal's campaign.\""
 crb_hannibal.6.a: "Follow the Barcids' example and establish an Iberian trading post."
 crb_hannibal.6.c: "Follow Rome's example and establish an Iberian province."
 crb_hannibal.7.t: "Homecoming: The Ancestral Throne"
 crb_hannibal.7.d: "Carthage's soldiers have entered Tyre. Nearly three thousand years ago, Queen Elissa left this city, crossed the sea to Africa, and founded Carthage. Now her descendants have returned.\n\nBefore the city's oldest temple of Melqart, the Suffete has laid an offering."
 crb_hannibal.7.f: "The daughter has returned to her mother's house."
 crb_hannibal.7.a: "The Carthaginians have come home."
 crb_hannibal.8.t: "Hannibal's Legacy"
 crb_hannibal.8.d: "Every possession held before the Punic Wars has been recovered. From Tyre to Gadir, from Sicily to Tripoli, Carthage is once more a Mediterranean power.\n\nYet in the Popular Assembly, some have already begun to speak of the city beyond the Alps."
 crb_hannibal.8.f: "\"Romans, Hannibal stands at your gates!\""
 crb_hannibal.8.a: "Hannibal's work is not yet finished."
