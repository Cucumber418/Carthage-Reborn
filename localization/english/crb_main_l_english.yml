 crb_ig_baal_hasadeh_desc: "The great families who own broad estates, olive groves, and fertile valleys. Their command of the countryside and its traditional order makes them the foundation of the old aristocracy and the Senate."
 crb_ig_votaries_desc: "Priests, temple attendants, and the communities gathered around the sanctuaries. They conduct the rites of Tanit and the gods, preserve religious tradition, and regard temple authority as the foundation of the republic's public life."
 crb_ig_baal_oniyah_desc: "Seafaring families engaged in merchant shipping, shipbuilding, and overseas trade. Their wealth rests upon shipping routes, ports, and distant trading posts, and they guard the security and privileges of maritime commerce."
 crb_ig_soperim_desc: "Educated scribes, scholars, and clerks. They keep the accounts, laws, and diplomatic correspondence, sustain urban administration and commercial contracts, and seek to govern the republic through learning and sound institutions."
 ig_trait_crb_elephant_corps: "Elephant Corps"
 ig_trait_crb_elephant_corps_desc: "When the Armed Forces are Loyal (+10 Approval), Carthage's elephant corps grants the entire army +20% Offense."
 law_crb_governor_rule: "Governorship"
 law_crb_governor_rule_desc: "A special form of monarchy in which authority is vested in a governor appointed by Carthage. The governor directs the administration, tax registers, and local affairs; the office is not inherited as a royal throne."
 RULER_TITLE_CRB_GOVERNOR: "Governor"
 gov_crb_trading_post_governor: "Trading Post Governorship"
 gov_crb_trading_post_governor_desc: "A governor administers the trading post on behalf of Carthage, while merchants and shipowners conduct their business through its ports, warehouses, and contracts.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_crb_province_governor: "Provincial Governorship"
 gov_crb_province_governor_desc: "A governor rules the province on behalf of Carthage. Its offices maintain the tax registers, appoint officials, and preserve order in the towns and along the roads.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
