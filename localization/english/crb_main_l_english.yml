 law_crb_dual_sufetes: "Dual Suffetes"
 law_crb_dual_sufetes_desc: "An ancient system in which the Senate and the Popular Assembly share the government of the state. Two officials are elected each year to serve jointly in the office of $RULER_TITLE_CRB_SUFETE$, preventing power from falling into the hands of one man."
 RULER_TITLE_CRB_SUFETE: "Suffete"
 gov_crb_sufetes_oligarchy: "Senatorial Republic"
 gov_crb_sufetes_oligarchy_desc: "In this [concept_government_type], the [concept_country] is governed by senators drawn from its foremost families. Two senators are chosen to share the office of $RULER_TITLE_CRB_SUFETE$.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_crb_sufetes_assembly: "Popular Assembly Republic"
 gov_crb_sufetes_assembly_desc: "In this [concept_government_type], the [concept_country]'s office of $RULER_TITLE_CRB_SUFETE$ is shared by two representatives [Concept('concept_election','$concept_elected|q$')] by the Popular Assembly. The Senate and the Assembly share the government of the state.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
