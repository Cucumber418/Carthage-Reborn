 crb_independence.1.t: "A Country of Its Own"
 crb_independence.1.d: "The streets of [ROOT.GetCountry.GetName] fly their own flags. Orders from the former overlord no longer reach the offices of government. Local notables, assembly members, and officers gather in the capital to debate who shall speak for the country and where authority shall rest."
 crb_independence.1.f: "“The seal is still on the table, but from this day it belongs to this land alone.”"
 crb_independence.1.a: "Let the cabinet answer to parliament."
 crb_independence.1.b: "Let an elected president lead the country."
 crb_independence.1.c: "Crown a monarch for our country."
 crb_independence.1.e: "Let the organized professions shape the state."
 crb_independence.1.g: "Entrust power to the councils of workers."
 crb_independence.1.h: "Let faith guide the country."
