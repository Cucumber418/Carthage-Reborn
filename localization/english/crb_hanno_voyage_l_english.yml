l_english:
 je_crb_hanno_voyage: "The Voyage of Hanno"
 je_crb_hanno_voyage_lobby: "If the Hannonids prevail in the factional struggle, or Carthage begins to establish colonies, its sailors will follow Hanno beyond the Pillars of Heracles to Africa's Atlantic coast."
 je_crb_hanno_voyage_reason: "More than two thousand years ago, Carthage sent Hanno the Navigator beyond the Pillars of Heracles and south along Africa's Atlantic coast, founding cities and trading posts along the way. Upon his return, he recorded the voyage on a stele in the temple of Baal Hammon.\n\nToday the senators, unwilling to contest the Mediterranean with the great powers, turn their gaze toward the Atlantic. Hanno's route still awaits them."
 crb_hv_start_tt: "The #b Hannonids#! have won the factional struggle, or [GetLawType('law_colonial_resettlement').GetName] or [GetLawType('law_colonial_exploitation').GetName] has been enacted"
 crb_hv_status_peace: "Carthage has been at peace for #v [JournalEntry.GetCountry.MakeScope.Var('crb_hv_peace_months').GetValue|0]#! consecutive months. #b A Lasting Peace#! requires #v 120#! consecutive months without war."
 crb_hv_status_war: "Carthage is at war. #b A Lasting Peace#! requires #v 120#! consecutive months without war."
 crb_hv_status_default: "Follow Hanno's route to Africa's Atlantic coast."
 crb_hv_lixus_tt: "#b Return to [ROOT.GetCountry.GetCustom('crb_hv_lixus_current_name')]#!: Own land in #v [ROOT.GetCountry.GetCustom('crb_hv_lixus_current_name')]#!"
 crb_hv_kerne_tt: "#b The Trading Post of [ROOT.GetCountry.GetCustom('crb_hv_kerne_current_name')]#!: Own a state with a [GetBuildingType('building_port').GetName] in #v [ROOT.GetCountry.GetCustom('crb_hv_kerne_current_name')]#!"
 crb_hv_chretes_tt: "#b [ROOT.GetCountry.GetCustom('crb_hv_chretes_current_name')]#!: Own land in #v [ROOT.GetCountry.GetCustom('crb_hv_chretes_current_name')]#!"
 crb_hv_chariot_tt: "#b Reach [ROOT.GetCountry.GetCustom('crb_hv_chariot_current_name')]#!: Own land in #v [ROOT.GetCountry.GetCustom('crb_hv_chariot_current_name')]#!"
 crb_hv_peace_tt: "#b A Lasting Peace#!: Remain at peace for #v 10#! consecutive years"
 crb_hanno_voyage.0.t: "The Voyage of Hanno"
 crb_hanno_voyage.0.d: "An ancient manuscript survives in the Senate's archives. Said to have been translated from a stele in the temple of Baal Hammon, it records Hanno the Navigator's passage beyond the Pillars of Heracles and south along the African coast.\n\nToday the senators have brought it out once more. Rather than contest the Mediterranean with the great powers, Carthage should follow Hanno's course and seek its future upon the Atlantic shore."
 crb_hanno_voyage.0.f: "\"The Carthaginians resolved that Hanno should sail beyond the Pillars of Heracles and found cities of the Libyphoenicians. He set out with sixty ships of fifty oars.\"\n\n—Hanno of Carthage, #italic Periplus#!"
 crb_hanno_voyage.0.a: "Set sail."
 crb_hanno_voyage.1.t: "Return to Lixus"
 crb_hanno_voyage.1.d: "Carthage's banner flies once more upon the banks of the Lixus. Hanno stopped here in antiquity, befriending the nomads along the river and finding guides who knew the southern coast.\n\nThe [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] have already leased warehouses at the river mouth and are preparing routes to the south."
 crb_hanno_voyage.1.f: "\"We came to a great river called the Lixus. The nomadic Lixites pastured their cattle upon its banks.\"\n\n—Hanno of Carthage, #italic Periplus#!"
 crb_hanno_voyage.1.a: "The southern coast awaits us."
 crb_hanno_voyage.2.t: "The Trading Post of Cerne"
 crb_hanno_voyage.2.d: "The Carthaginians have built a port at Cerne. Hanno established one of his most distant trading posts here, where Carthaginian merchants exchanged pottery and perfumes for ivory and hides.\n\nToday the harbor is crowded with merchantmen from Carthage. Settlers are making their way south along the coast."
 crb_hanno_voyage.2.f: "\"We settled colonists upon a small island and called it Cerne.\"\n\n—Hanno of Carthage, #italic Periplus#!"
 crb_hanno_voyage.2.a: "Let more settlers come to Cerne."
 crb_hanno_voyage.3.t: "The River Chretes"
 crb_hanno_voyage.3.d: "Carthaginian explorers have followed the Chretes inland. Their reports echo Hanno's account: a broad river, dense forests upon its banks, and waters teeming with crocodiles and hippopotamuses.\n\nWord of the river has spread swiftly through Carthage."
 crb_hanno_voyage.3.f: "\"We reached another great river, filled with crocodiles and hippopotamuses.\"\n\n—Hanno of Carthage, #italic Periplus#!"
 crb_hanno_voyage.3.a: "Mark the river upon Carthage's maps."
 crb_hanno_voyage.4.t: "The Chariot of the Gods"
 crb_hanno_voyage.4.d: "The Carthaginian fleet has reached the end of Hanno's voyage. By night, the sailors saw flames issuing from a high coastal mountain, their glow reflected upon the sea, just as Hanno described more than two thousand years ago.\n\nThe captain has recorded in his journal that this volcano is the Chariot of the Gods."
 crb_hanno_voyage.4.f: "\"By night we saw a flame higher than all the others, seeming to reach the stars. In daylight it proved to be a very high mountain, called the Chariot of the Gods.\"\n\n—Hanno of Carthage, #italic Periplus#!"
 crb_hanno_voyage.4.a: "We have followed Hanno to the end."
 crb_hanno_voyage.5.t: "A Lasting Peace"
 crb_hanno_voyage.5.d: "Carthage has remained at peace for ten full years. The senators have held a banquet in the chamber to celebrate this uncommon achievement.\n\nAn elderly senator offered a toast: the Romans knew how to win wars, but the Carthaginians know how to make peace prosper. The wealth of merchantmen, estates, and ports endures longer than any victory."
 crb_hanno_voyage.5.f: "\"War brings glory to generals. Peace brings wealth to Carthage.\""
 crb_hanno_voyage.5.a: "May peace endure."
 crb_hanno_voyage.6.t: "Hanno's Route"
 crb_hanno_voyage.6.d: "From Lixus to the Chariot of the Gods, the route Hanno followed more than two thousand years ago is once more filled with Carthaginian sails.\n\nThe Senate has ordered a new stele to be raised in the temple of Baal Hammon, beside Hanno's own, recording the course of this latest voyage."
 crb_hanno_voyage.6.f: "\"Carthage's future lies upon the sea, not in Rome.\""
 crb_hanno_voyage.6.a: "Let those who follow remember this route."
