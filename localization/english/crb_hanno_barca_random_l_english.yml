 crb_hanno_barca_random.10.t: "The Veterans' Petition"
 crb_hanno_barca_random.10.d: "Veterans returning from the front have gathered before the Senate. They have shed blood for Carthage, they say, yet are not even entitled to speak in its Popular Assembly.\n\nTheir representatives have delivered a petition to the Suffete: grant the veterans full citizenship, or at least pay the bounty promised before the campaign."
 crb_hanno_barca_random.10.f: "\"Beneath Constantine's walls, we did not ask who was noble and who was common.\""
 crb_hanno_barca_random.10.a: "Whoever fights for Carthage is its citizen."
 crb_hanno_barca_random.10.b: "Pay their bounty and send them home."
 crb_hb_veterans_enfranchised: "Veterans Enfranchised"
 crb_hb_veterans_paid: "Veterans' Bounties"
 crb_hanno_barca_random.11.t: "The Senators' Banquet"
 crb_hanno_barca_random.11.d: "Several of the oldest senatorial families have jointly invited the Suffete to a banquet. It will be held in a villa overlooking the old harbor, ostensibly to discuss this year's taxes and grain prices.\n\nEveryone understands that accepting means taking the senators' side. Refusal would be taken as an affront to the great families."
 crb_hanno_barca_random.11.f: "\"The wine comes from Sicily, the guests from Carthage's finest families, and the true business never appears upon the invitation.\""
 crb_hanno_barca_random.11.a: "Attend and discuss affairs of state."
 crb_hanno_barca_random.11.b: "State business belongs in the chamber."
 crb_hb_senate_banquet_attended: "Attended the Senators' Banquet"
 crb_hb_senate_banquet_declined: "Declined the Senators' Banquet"
 crb_hanno_barca_random.12.t: "An Orator in the Square"
 crb_hanno_barca_random.12.d: "Each morning, a young orator stands upon the steps of the assembly square and recounts the deeds of the Barcids to shopkeepers, craftsmen, and dockworkers. The senators betrayed Hannibal then, he declares, and would betray Carthage's future now.\n\nHis audience grows daily. The Senate demands that the government disperse the gatherings."
 crb_hanno_barca_random.12.f: "\"They call this order. I call it the comfort of the few.\""
 crb_hanno_barca_random.12.a: "Citizens have the right to discuss their government."
 crb_hanno_barca_random.12.b: "Disperse the crowd. The square is not the Senate."
 crb_hb_orator_tolerated: "The Orator Tolerated"
 crb_hb_orator_dispersed: "The Gathering Dispersed"
 crb_hanno_barca_random.13.t: "The Shipowners' Routes"
 crb_hanno_barca_random.13.d: "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] have petitioned the government. Merchant vessels are repeatedly plundered upon the Mediterranean, they complain, while all public funds go to the army.\n\nThe officers reply that Carthage's enemies lie on land, not at sea. This year's budget can satisfy only one side."
 crb_hanno_barca_random.13.f: "\"Carthage was born upon the sea and may perish upon it. We ask only that you remember this.\""
 crb_hanno_barca_random.13.a: "Give priority to the army."
 crb_hanno_barca_random.13.b: "Give priority to protecting trade."
 crb_hb_army_first: "The Army First"
 crb_hb_trade_first: "The Trade Routes First"
 crb_hanno_barca_random.14.t: "The Oracle of Tanit"
 crb_hanno_barca_random.14.d: "On the night of the new moon, the priests of Tanit performed a sacrifice. The flames before the goddess's image are said to have flickered strangely, provoking three days of argument among the priesthood.\n\nSome see a promise of victory in battle; others insist that the goddess counsels caution. The temple asks the Suffete for a final interpretation."
 crb_hanno_barca_random.14.f: "\"Tanit is the face of Baal. Her gaze has never left Carthage.\""
 crb_hanno_barca_random.14.a: "The goddess foretells victory."
 crb_hanno_barca_random.14.b: "The goddess counsels caution."
 crb_hb_omen_of_victory: "An Omen of Victory"
 crb_hb_omen_of_caution: "An Omen of Caution"
 crb_hanno_barca_random.15.t: "Pay in Arrears"
 crb_hanno_barca_random.15.d: "The army has gone unpaid for three months. The senators responsible for the funds plead an empty Treasury, but the soldiers know that those same senators' estates have never lacked for money.\n\nDiscontent spreads through the camps. Some officers propose a special levy upon the great families to meet the arrears."
 crb_hanno_barca_random.15.f: "\"The mercenaries returning from Sicily were denied their pay and burned all Africa. Have the senators forgotten?\""
 crb_hanno_barca_random.15.a: "Levy a special tax upon the great families."
 crb_hanno_barca_random.15.b: "The army must wait."
 crb_hb_soldiers_paid_by_nobles: "Army Pay from the Great Families"
 crb_hb_soldiers_unpaid: "Army Pay in Arrears"
 crb_hanno_barca_random.16.t: "Who Is a Carthaginian?"
 crb_hanno_barca_random.16.d: "As the Popular Assembly grows in power, a question can no longer be avoided: who is entitled to Carthaginian citizenship?\n\nThe Barcids argue that everyone who speaks Punic and worships Tanit should be a citizen. The senators insist that citizenship belongs only to ancient families able to prove their descent."
 crb_hanno_barca_random.16.f: "\"After two thousand years, whose veins still carry pure Punic blood? Only the language and the gods have endured.\""
 crb_hanno_barca_random.16.a: "All who speak Punic are Carthaginians."
 crb_hanno_barca_random.16.b: "Citizenship belongs to the ancient families."
 crb_hb_open_citizenship: "Open Citizenship"
 crb_hb_closed_citizenship: "Restricted Citizenship"
 crb_hanno_barca_random.17.t: "Rumors of a King"
 crb_hanno_barca_random.17.d: "A rumor has reached the barracks: at a banquet, someone raised a cup and hailed a Barcid general as king. Ancient Carthage had kings of its own, so the title is hardly unknown. In a republic, however, it is enough to keep the senators awake at night.\n\nThe Senate demands an investigation. The general himself laughs the matter off."
 crb_hanno_barca_random.17.f: "\"The republic needs victories. What does it matter what the victor is called?\""
 crb_hanno_barca_random.17.a: "A drunken jest, nothing more."
 crb_hanno_barca_random.17.b: "Find the source of these rumors."
 crb_hb_king_rumor_tolerated: "Royal Rumors Tolerated"
 crb_hb_king_rumor_investigated: "Royal Rumors Investigated"
