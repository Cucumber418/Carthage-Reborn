l_simp_chinese:
 ############################################################
 # 日志：迦太基文化复兴
 ############################################################
 je_crb_cultural_revival: "迦太基文化复兴"
 je_crb_cultural_revival_lobby: "复兴种植园、治理被罗马人撒过盐的土地、推广塔尼特多神教，并在古港遗址上重建科同港。"
 je_crb_cultural_revival_reason: "两千年来，迦太基的语言、神祇和技艺只在零星的村落和古老的家族中流传。如今共和国重生了，元老们和公民们都相信，迦太基的复兴不能只靠刀剑，还要让这片土地重新长满庄稼，让神庙重新燃起圣火，让港口重新停满船只。"
 crb_revival_status_default: "完成全部四项复兴事业，迦太基的文化将真正重生。"
 crb_revival_status_salt_in_progress: "盐碱地的治理已经进行了[JournalEntry.GetCountry.MakeScope.Var('crb_salt_years').GetValue|v0]年，满#v 10#!年即可完成。"

 crb_revival_plantations_tt: "#b 复兴种植园#!：在海内外拥有至少#v 20#!级种植园"
 crb_revival_salt_tt: "#b 治理盐碱地#!：研究[GetTechnology('intensive_agriculture').GetName]后开始治理，持续#v 10#!年"
 crb_revival_tanit_tt: "#b 推广多神教#!：全国至少#v 80%#!的人口信仰[GetReligion('crb_tanit').GetName]"
 crb_revival_harbor_tt: "#b 重建港口#!：研究[GetTechnology('reinforced_concrete').GetName]后，在迦太基建成#b U 型港#!"

 crb_salt_marsh_button: "治理盐碱地"
 crb_salt_marsh_button_desc: "两千年前，罗马人曾在我们的土地上撒盐。今天，我们将把这片土地救回来。治理需要连续投入#v 10#!年的资金。"
 crb_owns_carthage_tt: "拥有#b 迦太基#!地区"

 crb_revived_plantations: "复兴的种植园"
 crb_salt_reclamation: "治理盐碱地"
 crb_salt_reclaimed: "盐碱地重获新生"
 crb_tanit_triumphant: "塔尼特的圣火"
 crb_cothon_rebuilt: "科同港重建"
 crb_punic_revival: "布匿复兴"
 crb_punic_revival_desc: "迦太基的语言、神祇和技艺重新成为这片土地的主人。"

 ############################################################
 # 奇观：U 型港
 ############################################################
 building_crb_cothon: "U 型港"
 building_crb_cothon_desc: "古迦太基的军港名为“科同”，由一座环形内港和一条长长的外港组成，可以同时容纳两百艘战舰。罗马人摧毁迦太基时，它也一同沉入了海底。"
 pmg_base_building_crb_cothon: "基础"
 pm_default_building_crb_cothon: "U 型港"

 ############################################################
 # 事件
 ############################################################
 crb_revival.1.t: "复兴的种植园"
 crb_revival.1.d: "从迦太基周边的橄榄林到海外的种植园，布匿人的农庄再次遍布各地。马戈的农书被重新译成布匿语，在庄园主之间传抄。\n\n两千年前，罗马人曾专门把这部农书带回罗马。如今，它终于回到了自己的家乡。"
 crb_revival.1.f: "“想要购买田地的人，应当先卖掉城里的房子，这样他才会更愿意住在乡间，而不是城里。”\n\n——马戈，#italic 《农书》#!"
 crb_revival.1.a: "迦太基的田野再次丰饶。"

 crb_revival.2.t: "盐碱地重获新生"
 crb_revival.2.d: "十年的辛劳终于有了回报。沟渠疏通了，盐分被冲刷干净，迦太基城外的荒地上重新长出了麦子。\n\n老人们说，这是两千年来第一次有人在这片土地上收获庄稼。"
 crb_revival.2.f: "罗马人在这里撒下了盐，而我们收获了麦子。"
 crb_revival.2.a: "这片土地从未真正死去。"

 crb_revival.3.t: "塔尼特的圣火"
 crb_revival.3.d: "全国绝大多数人都已在塔尼特的神庙前献上祭品。新月之夜，从迦太基到边远的村庄，到处都燃起了圣火。\n\n祭司们宣称，女神的面容再次注视着她的人民。"
 crb_revival.3.f: "“献给女神塔尼特，巴力的面容。”\n\n——迦太基托非特石碑上的铭文"
 crb_revival.3.a: "女神与我们同在。"

 crb_revival.4.t: "科同港重建"
 crb_revival.4.d: "新的科同港落成了。环形的内港中央重新建起了指挥塔，从塔上可以望见整个港湾。工程师们使用了最新的钢筋混凝土，但港口的形状与两千年前一模一样。\n\n第一艘驶入内港的船只挂着迦太基的旗帜。"
 crb_revival.4.f: "“港口的入口宽七十尺，用铁链封闭。外港供商船停泊，内港只供战舰使用。”\n\n——阿庇安，#italic 《布匿战争》#!"
 crb_revival.4.a: "迦太基再次拥有了自己的港口。"

 crb_revival.5.t: "重建科同港的计划"
 crb_revival.5.d: "工程师们向苏菲特呈交了一份计划：借助新式的钢筋混凝土，完全可以在古港的遗址上重建科同港。\n\n#b U 型港#!奇观现已解锁，可以在迦太基地区建造。"
 crb_revival.5.f: "古人能做到的事，我们也能做到。"
 crb_revival.5.a: "开始规划吧。"

 crb_revival.6.t: "迦太基文化的复兴"
 crb_revival.6.d: "田野、神庙和港口都已恢复了往日的模样。布匿语在学校里教授，迦太基的历史在剧场里上演，年轻人以自己是迦太基人为荣。\n\n两千年前，罗马人以为他们已经抹去了迦太基。他们错了。"
 crb_revival.6.f: "迦太基仍未毁灭。"
 crb_revival.6.a: "迦太基重生了。"
