l_simp_chinese:
 company_crb_carthaginian_trade_house: "迦太基海贸商社"
 company_crb_carthaginian_trade_house_desc: "从迦太基旧港出发的商船往来于地中海各岸。商社经营港口、商站与远洋船队，力图让迦太基重新成为西地中海的贸易枢纽。"
 company_crb_tyrian_purple: "推罗紫染业公会"
 company_crb_tyrian_purple_desc: "以推罗与黎巴嫩沿岸为中心，经营染料种植园、织坊和海外销路。名贵的紫色织物仍是腓尼基商人最引以为傲的商品。"
 company_crb_punic_wine: "布匿葡萄酒商会"
 company_crb_punic_wine_desc: "商会收购迦太基周边的葡萄园，将本地佳酿装入双耳陶罐，运往地中海各地的港口与集市。"
 company_crb_cyprus_copper: "塞浦路斯铜业公司"
 company_crb_cyprus_copper_desc: "以基提翁港为海上集散地，经营铜矿开采、冶炼与金属工具制造，重新连接塞浦路斯与腓尼基世界古老的铜贸易。"
 prestige_good_crb_tyrian_purple: "推罗紫"
 prestige_good_crb_tyrian_purple_desc: "以海螺染料制成的深紫色织物，价格昂贵，历来是腓尼基工匠与商人的珍贵商品。"
 prestige_good_crb_punic_wine: "布匿佳酿"
 prestige_good_crb_punic_wine_desc: "产自迦太基葡萄园的优质葡萄酒，以双耳陶罐装运，销往地中海各地。"
