 je_crb_territories: "迦太基的领土"
 je_crb_territories_reason: "随着领土扩展，元老院必须决定如何治理海内外的新土地。\n\n$subject_type_crb_trading_post_desc$\n\n$subject_type_crb_province_desc$\n\n成功建立商站或行省后，所有地区共用三个月的交接期。"
 je_crb_territories_status: "领土的治理"
 je_crb_territories_status_desc: "取得当地非首都土地即可决定治理方式。每次成功建立商站或行省后，所有地区共用三个月的交接期。"
 je_crb_territories_complete: "迦太基的领土"
 crb_found_hidden_province_effect_tt: "将我们在该区域直接管辖的非首都州交给新设行省，成为迦太基的附庸。"
 crb_carthaginian_navy: "迦太基舰队"
 crb_flavor.17.t: "高卢人？"
 crb_flavor.17.d: "法兰西的旗帜出现在北非边界的另一侧。元老院的书记重新翻检古老的记载，将眼前的邻人与昔日高卢人的名字联系起来。"
 crb_flavor.17.f: "边界上的哨兵传回消息：法兰西人与我们比邻而居。"
 crb_flavor.17.a: "我们并非初次相见。"
 crb_flavor_gallic_legacy: "布匿与高卢的记忆"
 crb_flavor_gallic_legacy_desc: "与法兰西接壤唤起了古代布匿人与高卢人的军事往事。"
 company_crb_carthaginian_trade_house: "迦太基商社"
 company_crb_tyrian_purple: "推罗紫染织公司"
 company_crb_punic_wine: "布匿佳酿公司"
 company_crb_cyprus_copper: "塞浦路斯铜业公司"
 prestige_good_crb_tyrian_purple: "推罗紫"
 prestige_good_crb_punic_wine: "布匿佳酿"
 crb_found_tripoli_post_button: "处置的黎波里"
 crb_found_tripoli_post_button_desc: "在和平时期，只要我们在的黎波里拥有至少一个非首都州，即可决定当地的治理方式。每次成功建立后，所有地区共用三个月冷却。"
 crb_can_found_tripoli_trigger: "我们在的黎波里拥有可处置的非首都土地，且对应附庸尚未存在。"
 crb_revenge.10.t: "的黎波里的未来"
 crb_revenge.10.d: "我们已经在的黎波里取得土地。元老院可以将这些属地交给商人，让契约、货栈与港口联结迦太基；也可以委任总督，由官吏、税册和巡查者维持地方秩序。未取得的土地仍归现有统治者，首都继续直辖。"
 crb_revenge.10.f: "新领土的治理方式有待议定。"
 crb_revenge.10.a: "设立的黎波里商站。"
 crb_revenge.10.b: "设立的黎波里行省。"
 crb_revenge.10.c: "暂由迦太基直接管辖。"
 crb_create_puppet_TRP_effect_tt: "沙漠商队与海港将在商人的契约下相接，货栈向远方客商敞开，商站把繁忙集市的一部分进项送往迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_TRP_effect_tt: "总督府将接过绿洲与海岸的税册，任用官吏巡察驿路，把商队与聚落纳入迦太基的秩序。行省缴纳收入的50%。"
