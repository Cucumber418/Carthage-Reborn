 crb_territories.4.t: "叙利亚的治理"
 crb_territories.4.d: "叙利亚的城镇与驮队道路联结海岸和东方。市集里的货物需要稳定的契约，驿路上的村镇需要清楚的规矩：是交由商人经营新商站，还是让总督带着税册前来？\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
