 crb_revenge.6.t: "高卢的未来"
 crb_revenge.6.d: "宽阔河流穿过高卢的田野与市镇，商人沿河寻找货栈，乡绅们则在议事厅中衡量新宗主的安排。我们可以让商路渐渐联结这片土地，也可以用总督府和巡查者建立更直接的秩序。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.6.f: "“让河上的船先来，还是让总督的印玺先到？”"
 crb_revenge.6.a: "设立高卢商站。"
 crb_revenge.6.b: "设立高卢行省。"
 crb_revenge.6.c: "暂由迦太基直接管辖。"
 crb_create_puppet_GLT_effect_tt: "商人将在河港与市镇开设货栈，拥有地产的乡绅参与地方议事，高卢的集市向地中海贸易敞开。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_GLT_effect_tt: "总督将派官员接管城镇税册，巡查道路与集市，把我们在高卢的土地编入迦太基的行省体系。行省缴纳收入的50%。"
