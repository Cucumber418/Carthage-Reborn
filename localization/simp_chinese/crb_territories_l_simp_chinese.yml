 crb_revenge.5.t: "罗马的未来"
 crb_revenge.5.d: "古老的广场与意大利海岸的港口，如今等待迦太基决定它们的未来。船主希望沿海商埠以财富和契约相联；元老院也可以把税册、任官与城市巡查交给坐镇当地的总督。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.5.f: "“昔日发号施令的城市，也会等候远方送来的印玺。”"
 crb_revenge.5.a: "设立伊奥尼亚商站。"
 crb_revenge.5.b: "设立罗马行省。"
 crb_revenge.5.c: "暂由迦太基直接管辖。"
 crb_create_puppet_IOP_effect_tt: "沿岸港口将围绕商人和船主的议事厅运转，富有的市民参与地方议事，海运契约把各座商埠联结起来。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_puppet_RPR_effect_tt: "总督将坐镇罗马，任用官吏、清点税册并派人巡察城市；塔尼特的祭坛将受到官府庇护，意大利的属地向迦太基交账。行省缴纳收入的50%。"
 crb_create_province_IOP_effect_tt: "总督府将接管当地税册与官吏任用，使沿岸城镇向迦太基交账。行省缴纳收入的50%。"
 crb_create_province_RPR_effect_tt: "总督将坐镇罗马，任用官吏、清点税册并派人巡察城市；塔尼特的祭坛将受到官府庇护，意大利的属地向迦太基交账。行省缴纳收入的50%。"
