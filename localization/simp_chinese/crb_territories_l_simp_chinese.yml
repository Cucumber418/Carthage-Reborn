 crb_found_tripoli_post_button: "处置的黎波里"
 crb_found_tripoli_post_button_desc: "在和平时期，只要我们在的黎波里拥有至少一个非首都州，即可决定当地的治理方式。每次成功建立后，所有地区共用三个月冷却。"
 crb_can_found_tripoli_trigger: "我们在的黎波里拥有可处置的非首都土地，且对应附庸尚未存在。"
 crb_revenge.10.t: "的黎波里的未来"
 crb_revenge.10.d: "海岸上的商埠与沙漠深处的绿洲，隔着一条条驮队走过的道路。商人希望把货栈与市场交给熟悉当地的合伙人，总督的支持者则提议清点驿路、田亩与税册。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.10.f: "“海上的船主认得港口，沙漠里的驼夫认得每一眼井。”"
 crb_revenge.10.a: "设立的黎波里商站。"
 crb_revenge.10.b: "设立的黎波里行省。"
 crb_revenge.10.c: "暂由迦太基直接管辖。"
 crb_create_puppet_TRP_effect_tt: "沙漠商队与海港将在商人的契约下相接，货栈向远方客商敞开，商站把繁忙集市的一部分进项送往迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_TRP_effect_tt: "总督府将接过绿洲与海岸的税册，任用官吏巡察驿路，把商队与聚落纳入迦太基的秩序。行省缴纳收入的50%。"
