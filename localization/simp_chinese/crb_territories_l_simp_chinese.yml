 je_crb_territories_reason: "随着领土扩展，元老院必须决定如何治理海内外的新土地。\n\n$subject_type_crb_trading_post_desc$\n\n$subject_type_crb_province_desc$\n\n新建商站、行省或将商站行省化后，所有地区共用三个月的交接期。"
 je_crb_territories_status: "领土的治理"
 je_crb_territories_status_desc: "取得当地非首都土地即可决定治理方式。每次新建商站、行省或将商站行省化后，所有地区共用三个月的交接期。"
 je_crb_territories_complete: "迦太基的领土"
 crb_found_hidden_province_effect_tt: "将我们在该区域直接管辖的非首都州交给新设行省，成为迦太基的附庸。"
 crb_carthaginian_navy: "迦太基舰队"
 crb_flavor.17.t: "高卢人？"
 crb_flavor.17.d: "法国仍在北非保有土地，元老院必须再次议定对待这些“高卢人”的办法。史官忆起昔日高卢部族曾与汉尼拔并肩作战，将军们却把眼前的法国人视作争夺非洲的强邻。\n\n是以赠款和盟友旧事换取五年安宁，还是针锋相对，抑或暂且顺其自然？每五年，我们都将重新作出选择，直到法国离开北非。"
 crb_flavor.17.f: "“他们的祖先曾与我们并肩而行。眼前的法兰西人，会接受这份旧日情谊吗？”"
 crb_flavor.17.a: "忆起高卢人的援手，赠金修好。"
 crb_flavor_gallic_legacy: "与高卢人针锋相对"
 crb_flavor_gallic_legacy_desc: "我们选择对法国强硬相向，军队准备以更猛烈的攻势回应这些“高卢人”。五年内击杀率提高10%。"
