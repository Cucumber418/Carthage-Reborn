 crb_territories.5.t: "美索不达米亚的治理"
 crb_territories.5.d: "两河的水路在城镇、农田与集市之间蜿蜒。商人看见仓栈和转运的机会，总督的支持者则看见需要清点的田亩、税册与驿路。我们取得的土地将由此进入另一段历史。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_territories.5.f: "“船从河上来，驮队从陆上来，最后都停在城门下。”"
 crb_territories.5.a: "设立美索不达米亚行省。"
 crb_territories.5.b: "暂由迦太基直接管辖。"
 crb_found_arabia_province_button: "处置阿拉伯"
 crb_found_arabia_province_button_desc: "在和平时期，只要我们在阿拉伯拥有至少一个非首都州，即可决定当地的治理方式。每次成功建立后，所有地区共用三个月冷却。"
 crb_can_found_arabia_trigger: "我们在阿拉伯拥有可处置的非首都土地，且对应附庸尚未存在。"
