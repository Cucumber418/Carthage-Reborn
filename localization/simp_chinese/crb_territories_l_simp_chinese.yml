 crb_revenge.11.t: "努米底亚的未来"
 crb_revenge.11.d: "努米底亚的田庄、市集与内陆聚落已经与我们的海岸相接。有人愿以契约争取商人和地方显贵，也有人认为，只有总督府统一编订税册，才能让城镇与牧地接受长久的秩序。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.11.f: "“骑手带来内陆的消息，谷物和账册则一道来到城门前。”"
 crb_revenge.11.a: "设立努米底亚商站。"
 crb_revenge.11.b: "设立努米底亚行省。"
 crb_revenge.11.c: "暂由迦太基直接管辖。"
 crb_create_puppet_NUM_effect_tt: "沿岸货栈将与内陆市集连成一线，商人自由经营田产与买卖，努米底亚的收成沿贸易道路流向迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_NUM_effect_tt: "总督将清点田亩、整编税册，让城镇与内陆聚落向同一座总督府交账，巡查者维护迦太基的统治。行省缴纳收入的50%。"
