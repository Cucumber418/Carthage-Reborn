 company_crb_carthaginian_trade_house_desc: "以迦太基港口为中心经营贸易与海运的商社。"
 company_crb_tyrian_purple_desc: "经营推罗沿岸染料与纺织业的公司，沿用腓尼基染紫技艺的声名。"
 company_crb_punic_wine_desc: "经营北非葡萄种植与酿造业的公司。"
 company_crb_cyprus_copper_desc: "经营地中海东部铜矿与工具制造的矿业公司。"
 prestige_good_crb_tyrian_purple_desc: "沿用推罗之名的紫色染料，以浓郁的色泽著称。"
 prestige_good_crb_punic_wine_desc: "产自布匿葡萄园、供远方市场销售的佳酿。"
 crb_territories_status_cooldown: "地方政务正在交接。上一次新建商站、行省或将商站行省化后的三个月内，暂不能再次处置领土。"
 crb_territory_disposition_ready_tt: "上一次领土处置后的三个月交接期已经结束。"
 crb_territory_disposition_cooldown: "地方政务的交接"
 crb_territory_disposition_cooldown_desc: "使节、书记与地方官员正在完成地方政务的交接。三个月内，元老院暂不安排下一处商站或行省。"
 crb_territory_disposition_cooldown_effect_tt: "完成此次领土处置后，元老院需用三个月办理交接，其间不能新建商站、行省或进行行省化。"
 crb_found_hidden_trading_post_effect_tt: "将我们在该区域直接管辖的非首都州交给新设商站，成为迦太基的附庸；不增加成立恶名。"
 crb_create_puppet_CPM_effect_tt: "山地市集与大西洋商路将由商人联结，货栈向海上与沙漠来的客商敞开，地方进项沿商路流回迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPM_effect_tt: "总督府将丈量田亩、清点商道沿线的聚落，任命官吏巡察关隘，将我们在毛里塔尼亚的土地纳入同一套税册。行省缴纳收入的50%。"
 crb_create_puppet_CPE_effect_tt: "尼罗河的谷物与沿岸货物将汇入商人的仓栈，船主以契约组织转运，把埃及的市集联向地中海。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPE_effect_tt: "总督将沿尼罗河编订田亩与税册，派官员管理城镇事务，让谷地的赋税与账目汇往迦太基。行省缴纳收入的50%。"
 crb_create_puppet_CPF_effect_tt: "古老商埠将重新回响起布匿商人的议价声，染料、织物与海运契约把腓尼基沿岸联回迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPF_effect_tt: "总督府将设在腓尼基的城镇中，官吏接管税册并巡查港口，塔尼特的祭坛得到迦太基的庇护。行省缴纳收入的50%。"
 crb_create_puppet_CPS_effect_tt: "驮队、市集与沿海货栈将由商人的契约联结，叙利亚的道路再次成为迦太基货物通往东方的商路。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPS_effect_tt: "总督将把城镇与商道聚落编入税册，任命地方官员巡察驿路，让我们在叙利亚的土地向同一座总督府交账。行省缴纳收入的50%。"
 crb_create_puppet_CPB_effect_tt: "两河沿岸的集市与河运货栈将向商人敞开，谷物和手工业货物沿水陆商路汇入迦太基的贸易网络。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPB_effect_tt: "总督将清点两河沿岸的田亩与城镇，派官吏掌管税册和驿路，将我们取得的土地编成有序的行省。行省缴纳收入的50%。"
 crb_create_puppet_CPA_effect_tt: "绿洲集市与驼队将围绕商人的契约运转，海岸货栈联结香料、牲畜与远洋贸易，沿途商埠向迦太基缴纳进项。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_CPA_effect_tt: "总督将沿绿洲和驿路任命官吏，清点税册并巡察关隘，让分散的聚落接受迦太基的行省治理。行省缴纳收入的50%。"
