 crb_flavor.17.b: "那就和这些高卢人拼个高下！"
 crb_flavor.17.c: "顺其自然，五年后再议。"
 crb_gallic_appeasement: "追忆高卢的援手"
 crb_gallic_appeasement_desc: "我们以旧日援手为由赠金法兰西，换来五年的停战协议。期满后，元老院将重新议定对法方针。"
 crb_gallic_nonintervention: "静观法兰西"
 crb_gallic_nonintervention_desc: "我们暂不以法国在北非的存在改变方针，五年后再作议论。"
 crb_gallic_appeasement_peace_required_tt: "我们没有在战争或外交博弈中与法国敌对，能够签订新的停战协议。"
 crb_gallic_appeasement_effect_tt: "一次性向法国赠送相当于当前年GDP的1%的款项，法国收到等额金钱；关系改善20，并签订60个月的双向停战协议。五年后重新选择。"
 crb_gallic_confrontation_effect_tt: "与法国的关系降低50，部队击杀率提高10%，持续60个月。五年后重新选择。"
 crb_gallic_nonintervention_effect_tt: "本轮不增加金钱、关系或军事效果；60个月后重新选择。法国在北非失去全部土地后，循环结束。"
