 crb_revenge.7.t: "阿尔卑斯的未来"
 crb_revenge.7.d: "群山把聚落分隔在谷地，却也把南北商路汇聚到少数山口。客栈主人、驮队和守隘的民兵都等待着安排：以商人的契约维系山路，或让总督的官吏沿驿道逐一驻守。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.7.f: "“守住山口的人，听得见两边平原的消息。”"
 crb_revenge.7.a: "设立雪山商站。"
 crb_revenge.7.b: "设立阿尔卑斯行省。"
 crb_revenge.7.c: "暂由迦太基直接管辖。"
 crb_create_puppet_SNT_effect_tt: "山口市集与驮队客栈将成为商路的节点，地方民兵守望山隘，商人沿通往南北的道路经营货物。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_SNT_effect_tt: "总督将把山口、谷地和驿站编入统一的税册，任命官员驻守要道，让迦太基的命令越过群山。行省缴纳收入的50%。"
