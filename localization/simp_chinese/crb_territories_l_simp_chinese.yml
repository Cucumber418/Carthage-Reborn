 crb_create_puppet_NUM_effect_tt: "沿岸货栈将与内陆市集连成一线，商人自由经营田产与买卖，努米底亚的收成沿贸易道路流向迦太基。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_NUM_effect_tt: "总督将清点田亩、整编税册，让城镇与内陆聚落向同一座总督府交账，巡查者维护迦太基的统治。行省缴纳收入的50%。"
