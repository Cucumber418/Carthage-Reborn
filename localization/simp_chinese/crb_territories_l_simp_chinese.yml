 crb_territories.6.t: "阿拉伯的治理"
 crb_territories.6.d: "绿洲的集市、香料驮队与临海商埠散布在辽阔道路之间。商人愿借向导与契约经营这些节点；总督则会派官吏逐一清点聚落，把驿路与关隘编入同一套册籍。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_territories.6.f: "“沙漠里没有多余的水，账册里也不该有多余的一笔。”"
 crb_territories.6.a: "设立阿拉伯行省。"
 crb_territories.6.b: "暂由迦太基直接管辖。"
