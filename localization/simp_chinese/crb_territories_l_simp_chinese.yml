 crb_territories.3.t: "腓尼基的治理"
 crb_territories.3.d: "染料、织物与古老海港让这里的街巷仿佛仍回响着布匿商人的口音。我们可以以商站续接跨海的契约，也可以任命总督，让港口、税册和塔尼特的祭坛得到同一座官署的庇护。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_territories.3.f: "“船帆认得这片海岸，商人也记得祖辈留下的名字。”"
