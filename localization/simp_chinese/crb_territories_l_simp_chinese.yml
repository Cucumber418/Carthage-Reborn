 crb_revenge.12.t: "伊比利亚的未来"
 crb_revenge.12.d: "银矿、葡萄园与面向地中海的港口，再次进入迦太基人的视野。新迦太基的旧名唤起昔日远征的记忆，而眼前的选择关乎货物、田亩与每一座市镇明日向谁交账。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_revenge.12.f: "“一条道路通向矿山，另一条道路通向海。”"
 crb_revenge.12.a: "设立伊比利亚商站。"
 crb_revenge.12.b: "设立伊比利亚行省。"
 crb_revenge.12.c: "暂由迦太基直接管辖。"
 crb_create_puppet_IBT_effect_tt: "银矿的出产、葡萄酒与海上货物将汇入商人的账簿，新迦太基的商路再次伸向伊比利亚腹地。商站缴纳收入的30%，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_IBT_effect_tt: "总督将以税册和驿路联结城镇、矿区与田庄，地方官员向迦太基负责，塔尼特的祭坛得到官府庇护。行省缴纳收入的50%。"
