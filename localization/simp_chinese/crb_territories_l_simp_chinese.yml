 crb_territories.1.t: "毛里塔尼亚的治理"
 crb_territories.1.d: "大西洋来的海风与山地商道在这里相遇。驮队运来内陆的货物，沿岸商人等待新的合伙人；若任命总督，官吏便会沿关隘和集市清点我们取得的聚落。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_territories.1.f: "“海岸有货栈，山路有向导，元老院还缺一份治理它们的章程。”"
 crb_territories.1.a: "设立毛里塔尼亚行省。"
