 crb_territories.2.t: "埃及的治理"
 crb_territories.2.d: "尼罗河把田亩、谷仓和城镇联成一条长带。船主愿让河运与海运在商栈中接续，总督的拥护者则展开丈量土地的卷册，准备把谷地的赋税纳入有序的管理。\n\n这次安排只涉及我们在当地已经取得的非首都土地，尚未征服的地区仍由现有统治者管辖。"
 crb_territories.2.f: "“河水年年来，账册也应年年清。”"
