 crb_create_puppet_XGE_effect_tt: "河港、林场与工坊城镇将以商人契约联结，地方经营者沿莱茵河及其商路往来，让内陆的器物与原料进入更广阔的市场。商站缴纳收入的#v 30%#!，塔尼特的祭坛将伴随商人扎根当地。"
