 crb_provincialize_XIL_button_desc: "海湾的商人议事厅将改作总督官署，驮队经过的山口与内陆村镇由官员定期巡视。"
 crb_provincialize_XIL_button_effect_tt: "将#v $XIL_crb_trading_post$#!改为#v $XIL$#!，由总督接管辖区。保留现有土地、人口、建筑、国库、军队和当前自由欲，所有地区共用#v 3#!个月交接期。"
