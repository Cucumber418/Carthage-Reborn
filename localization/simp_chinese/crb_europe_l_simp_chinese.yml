 crb_expand_XET_province_button_desc: "将我们在伊特鲁里亚直接管辖的非首都且未处于殖民中的土地交给伊特鲁里亚行省。只处理这一个附庸的辖区。"
 crb_expand_XET_province_button_effect_tt: "把我们在伊特鲁里亚直接管辖的非首都且未处于殖民中的土地移交给伊特鲁里亚行省；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
