l_simp_chinese:
 XLU: "卢西塔尼亚行省"
 XLU_ADJ: "卢西塔尼亚"
 XLU_crb_trading_post: "卢西塔尼亚商站"
 crb_europe.1.t: "海风中的卢西塔尼亚"
 crb_europe.1.d: "大西洋的长浪拍打着卢西塔尼亚的海岸，盐场、渔村与河口城镇各循自己的时节。来自迦太基的船只带来了新的买主，地方显贵则带着旧契约走进议事厅，想知道远方的印玺将如何与这里的习惯相处。"
 crb_europe.1.f: "“盐留在岸上，船把岸外的消息带回来。”"
 crb_europe.1.a: "设立卢西塔尼亚商站。"
 crb_europe.1.b: "设立卢西塔尼亚行省。"
 crb_europe.1.c: "暂由迦太基直接管辖。"
 crb_found_lusitania_button: "处置卢西塔尼亚"
 crb_found_lusitania_button_desc: "和平时期，只需在卢西塔尼亚直接管辖一块非首都土地，即可决定当地的治理方式。成功建立或行省化后，所有地区共用三个月交接期。"
 crb_can_found_lusitania_trigger: "我们在卢西塔尼亚拥有可处置的非首都土地，且对应附庸尚未存在。"
 crb_create_puppet_XLU_tt: "#v $XLU_crb_trading_post$#!将作为#v [ROOT.GetCountry.GetName]#!的[concept_crb_trading_post]成立。\n将我们在该区域直接管辖的#v 非首都州#!移交给新属地。"
 crb_create_puppet_XLU_effect_tt: "河口的盐仓、船坞与市集将由商人串联起来，港口合伙人以契约经营仓栈，为驶向大西洋的船只补充货物与口粮。商站缴纳收入的#v 30%#!，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_XLU_tt: "#v $XLU$#!将作为#v [ROOT.GetCountry.GetName]#!的[concept_crb_province]成立。\n将我们在该区域直接管辖的#v 非首都州#!移交给新属地。"
 crb_create_province_XLU_effect_tt: "总督将把沿海城镇与河谷田庄编入同一套税册，修缮驿路，派遣官员巡视港湾，使海风吹得到的地方也听得见迦太基的命令。行省缴纳收入的#v 50%#!。"
 crb_expand_XLU_post_button: "扩张卢西塔尼亚商站"
 crb_expand_XLU_post_button_desc: "将我们在卢西塔尼亚直接管辖的非首都且未处于殖民中的土地交给卢西塔尼亚商站。只处理这一个附庸的辖区。"
 crb_expand_XLU_post_button_effect_tt: "把我们在卢西塔尼亚直接管辖的非首都且未处于殖民中的土地移交给卢西塔尼亚商站；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
 crb_expand_XLU_province_button: "扩张卢西塔尼亚行省"
 crb_expand_XLU_province_button_desc: "将我们在卢西塔尼亚直接管辖的非首都且未处于殖民中的土地交给卢西塔尼亚行省。只处理这一个附庸的辖区。"
 crb_expand_XLU_province_button_effect_tt: "把我们在卢西塔尼亚直接管辖的非首都且未处于殖民中的土地移交给卢西塔尼亚行省；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
 crb_provincialize_XLU_button: "行省化卢西塔尼亚"
 crb_provincialize_XLU_button_desc: "港口账房将扩展为总督府，河口盐场与内陆田庄的账册开始汇往同一座官署。"
 crb_provincialize_XLU_button_effect_tt: "将#v $XLU_crb_trading_post$#!改为#v $XLU$#!，由总督接管辖区。保留现有土地、人口、建筑、国库、军队和当前自由欲，所有地区共用#v 3#!个月交接期。"
 XET: "伊特鲁里亚行省"
 XET_ADJ: "伊特鲁里亚"
 XET_crb_trading_post: "伊特鲁里亚商站"
 crb_europe.2.t: "城墙之间的伊特鲁里亚"
 crb_europe.2.d: "伊特鲁里亚的钟声越过城墙，石匠、织工与商人从窄街走向广场。托斯卡纳的乡间道路连接着相互竞逐的城市，古老家族珍藏的印章与新近抵达的布匿文书，一同摆上了长桌。"
 crb_europe.2.f: "“城门见过许多旗帜，市集记得每一个买主。”"
 crb_europe.2.a: "设立伊特鲁里亚商站。"
 crb_europe.2.b: "设立伊特鲁里亚行省。"
 crb_europe.2.c: "暂由迦太基直接管辖。"
