 XGE_crb_trading_post: "日耳曼尼亚商站"
 crb_europe.12.t: "日耳曼尼亚的河流"
 crb_europe.12.d: "日耳曼尼亚的森林之外是河流与城镇，驳船经过旧城门，工坊的烟雾升起在河岸上空。许多地方显贵仍以各自的旗帜迎接使者，而迦太基的信件已经循着商路抵达他们的案头。"
 crb_europe.12.f: "“河水越过许多旗帜，也把许多城镇带到同一条航路上。”"
 crb_europe.12.a: "设立日耳曼尼亚商站。"
