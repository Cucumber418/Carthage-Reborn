 crb_provincialize_XNO_button_effect_tt: "将#v $XNO_crb_trading_post$#!改为#v $XNO$#!，由总督接管辖区。保留现有土地、人口、建筑、国库、军队和当前自由欲，所有地区共用#v 3#!个月交接期。"
 XBE: "贝尔吉卡行省"
 XBE_ADJ: "贝尔吉卡"
 XBE_crb_trading_post: "贝尔吉卡商站"
 crb_europe.11.t: "贝尔吉卡的潮汐"
 crb_europe.11.d: "贝尔吉卡的河流在低地分出许多水道，驳船从工坊城镇驶向潮湿的海港。堤岸后的市集习惯了远方来客，如今布匿商人的封印也出现在货单上，与地方行会的印章摆在一起。"
 crb_europe.11.f: "“潮水带船入港，运河把港口带进每一座城。”"
 crb_europe.11.a: "设立贝尔吉卡商站。"
 crb_europe.11.b: "设立贝尔吉卡行省。"
 crb_europe.11.c: "暂由迦太基直接管辖。"
 crb_found_belgica_button: "处置贝尔吉卡"
 crb_found_belgica_button_desc: "和平时期，只需在贝尔吉卡直接管辖一块非首都土地，即可决定当地的治理方式。成功建立或行省化后，所有地区共用三个月交接期。"
 crb_can_found_belgica_trigger: "我们在贝尔吉卡拥有可处置的非首都土地，且对应附庸尚未存在。"
 crb_create_puppet_XBE_tt: "#v $XBE_crb_trading_post$#!将作为#v [ROOT.GetCountry.GetName]#!的[concept_crb_trading_post]成立。\n将我们在该区域直接管辖的#v 非首都州#!移交给新属地。"
 crb_create_puppet_XBE_effect_tt: "港口、运河货栈与工坊将由商人和地方行会共同经营，河船把各城的器物汇向海口，让北海航路与迦太基的商网相接。商站缴纳收入的#v 30%#!，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_XBE_tt: "#v $XBE$#!将作为#v [ROOT.GetCountry.GetName]#!的[concept_crb_province]成立。\n将我们在该区域直接管辖的#v 非首都州#!移交给新属地。"
 crb_create_province_XBE_effect_tt: "总督将派书记整理港务、堤岸与城镇税册，沿运河巡视地方事务，使河口与腹地市镇归入统一的总督辖区。行省缴纳收入的#v 50%#!。"
 crb_expand_XBE_post_button: "扩张贝尔吉卡商站"
 crb_expand_XBE_post_button_desc: "将我们在贝尔吉卡直接管辖的非首都且未处于殖民中的土地交给贝尔吉卡商站。只处理这一个附庸的辖区。"
 crb_expand_XBE_post_button_effect_tt: "把我们在贝尔吉卡直接管辖的非首都且未处于殖民中的土地移交给贝尔吉卡商站；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
 crb_expand_XBE_province_button: "扩张贝尔吉卡行省"
 crb_expand_XBE_province_button_desc: "将我们在贝尔吉卡直接管辖的非首都且未处于殖民中的土地交给贝尔吉卡行省。只处理这一个附庸的辖区。"
 crb_expand_XBE_province_button_effect_tt: "把我们在贝尔吉卡直接管辖的非首都且未处于殖民中的土地移交给贝尔吉卡行省；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
 crb_provincialize_XBE_button: "行省化贝尔吉卡"
 crb_provincialize_XBE_button_desc: "运河账房将向总督府交账，港务、堤岸和工坊城镇的公文开始汇往同一座官署。"
 crb_provincialize_XBE_button_effect_tt: "将#v $XBE_crb_trading_post$#!改为#v $XBE$#!，由总督接管辖区。保留现有土地、人口、建筑、国库、军队和当前自由欲，所有地区共用#v 3#!个月交接期。"
 XGE: "日耳曼尼亚行省"
