 crb_create_puppet_XIL_effect_tt: "沿岸货栈将与山间驮队结成伙伴，船主和地方长老共同照料港口与集市，让亚得里亚海的船货深入山地腹地。商站缴纳收入的#v 30%#!，塔尼特的祭坛将伴随商人扎根当地。"
 crb_create_province_XIL_tt: "#v $XIL$#!将作为#v [ROOT.GetCountry.GetName]#!的[concept_crb_province]成立。\n将我们在该区域直接管辖的#v 非首都州#!移交给新属地。"
 crb_create_province_XIL_effect_tt: "总督将把港湾、山口与内陆聚落编入同一片辖区，巡查者沿驮道往来，使沿海官署的文书抵达群山之后。行省缴纳收入的#v 50%#!。"
 crb_expand_XIL_post_button: "扩张伊利里亚商站"
 crb_expand_XIL_post_button_desc: "将我们在伊利里亚直接管辖的非首都且未处于殖民中的土地交给伊利里亚商站。只处理这一个附庸的辖区。"
 crb_expand_XIL_post_button_effect_tt: "把我们在伊利里亚直接管辖的非首都且未处于殖民中的土地移交给伊利里亚商站；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
 crb_expand_XIL_province_button: "扩张伊利里亚行省"
 crb_expand_XIL_province_button_desc: "将我们在伊利里亚直接管辖的非首都且未处于殖民中的土地交给伊利里亚行省。只处理这一个附庸的辖区。"
 crb_expand_XIL_province_button_effect_tt: "把我们在伊利里亚直接管辖的非首都且未处于殖民中的土地移交给伊利里亚行省；其他附庸辖区、外国土地、首都和殖民中的地区不会转交。"
