 XIL: "伊利里亚行省"
 XIL_ADJ: "伊利里亚"
 XIL_crb_trading_post: "伊利里亚商站"
 crb_europe.3.t: "伊利里亚的山海"
 crb_europe.3.d: "伊利里亚的山脊直抵亚得里亚海，狭长港湾背后是石墙围起的村落与蜿蜒的山道。沿岸船主熟悉潮汐，内陆长老熟悉道路；他们来到岸边，与迦太基的来客商谈海湾另一端的世界。"
 crb_europe.3.f: "“海图画出了港湾，山路却要向住在山里的人问。”"
 crb_europe.3.a: "设立伊利里亚商站。"
 crb_europe.3.b: "设立伊利里亚行省。"
 crb_europe.3.c: "暂由迦太基直接管辖。"
