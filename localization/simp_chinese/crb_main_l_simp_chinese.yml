 crb_ig_baal_hasadeh_desc: "拥有广阔庄园、橄榄园和谷地地产的显贵家族。他们掌握乡间土地与传统秩序，是共和国旧贵族和元老院的根基。"
 crb_ig_votaries_desc: "祭司、神庙侍从以及依附于圣所的群体。他们主持塔尼特与诸神的祭仪，守护宗教传统，并将神庙的权威视为共和国公共生活的根基。"
 crb_ig_baal_oniyah_desc: "经营商船、船坞和远洋贸易的航海家族。他们凭借海上航线、港口和海外商站积累财富，关心航运安全与贸易特权。"
 crb_ig_soperim_desc: "受过教育的书记官、学者与文书官僚。他们掌握账册、法律和外交文书，维系城市行政与商业契约，主张以知识和制度治理共和国。"
 ig_trait_crb_elephant_corps: "战象兵团"
 ig_trait_crb_elephant_corps_desc: "当军队利益集团达到忠诚（+10）支持度时，迦太基的战象兵团为全军带来 +20% 进攻。"
 law_crb_governor_rule: "总督治理"
 law_crb_governor_rule_desc: "君主制的一种特殊变体。国家的治理权集中在由迦太基委任的总督手中，由总督主持官署、税册与地方事务；总督职位不作为世袭王位传承。"
 RULER_TITLE_CRB_GOVERNOR: "总督"
 gov_crb_trading_post_governor: "商站总督辖区"
 gov_crb_trading_post_governor_desc: "商站由总督代表迦太基主持地方政务，商人与船主围绕港口、货栈和契约经营贸易。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_crb_province_governor: "行省总督辖区"
 gov_crb_province_governor_desc: "行省由总督代表迦太基治理，官署清点税册、任用官员，并维持城镇和道路的秩序。\n\n$TRANSFER_OF_POWER_NAME_DESC$"
