 crb_independence.1.t: "独立的国度"
 crb_independence.1.d: "[ROOT.GetCountry.GetName]的街道升起了自己的旗帜。旧宗主的命令不再传入官署，城镇显贵、议事者与军官聚集在首都，争论谁将代表这个国家，以及权力应当由谁约束。"
 crb_independence.1.f: "“印玺仍在桌上，但从今天起，它只属于这片土地。”"
 crb_independence.1.a: "让内阁向议会负责。"
 crb_independence.1.b: "由民选总统主持国政。"
 crb_independence.1.c: "为国家加冕一位君主。"
 crb_independence.1.e: "让各行业代表组织国家。"
 crb_independence.1.g: "把权力交给劳动者的委员会。"
 crb_independence.1.h: "让信仰引领国家。"
