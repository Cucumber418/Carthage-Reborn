 je_group_crb_carthage: "迦太基"

 je_crb_hanno_barca: "汉诺派与巴卡派"
 je_crb_hanno_barca_lobby: "打下开局宣称的土地后，元老院中的汉诺派与依靠军队和民众的巴卡派之间将爆发一场争斗。巴卡派主张向海外开拓，汉诺派则希望守住田地和商路。"
 je_crb_hanno_barca_reason: "古迦太基的政治长期被两大派系所左右：以汉诺家族为首的元老们主张守住阿非利加的田地与海上的商路，避免与强国交战；以巴卡家族为首的将领们则依靠军队和民众，要求向海外开拓。两千年后，这场争论在重生的迦太基再度上演。\n$TOOLTIP_DELIMITER$\n@information!#b 汉诺派#!由[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]、[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]和[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]组成。他们希望维持现状，支持[GetLawType('law_oligarchy').GetName]、[GetLawType('law_hereditary_bureaucrats').GetName]和[GetLawType('law_protectionism').GetName]。\n\n#b 巴卡派#!由[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]、[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName]和[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]组成。他们要求复兴公民大会，支持[GetLawType('law_wealth_voting').GetName]、[GetLawType('law_elected_bureaucrats').GetName]和[GetLawType('law_mercantilism').GetName]。必要时，他们甚至愿意迎立一位民族的君主，以恢复布匿战争之前的疆域。"

