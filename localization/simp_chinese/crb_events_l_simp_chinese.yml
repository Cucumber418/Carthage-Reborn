 ############################################################
 # 事件：汉诺派与巴卡派
 ############################################################
 crb_hanno_barca.1.t: "元老院与公民大会"
 crb_hanno_barca.1.d: "迦太基的军队凯旋了。这是两千年来布匿人的第一次胜利，归来的士兵和欢呼的市民不再满足于让元老们代为决断。在迦太基的广场上，人们重新谈起了古老的公民大会，谈起了曾经率领迦太基人越过阿尔卑斯山的巴卡家族。\n\n元老院中的汉诺派对此深感不安。在他们看来，迦太基的复兴应当依靠田地和商船，而不是一场又一场的远征。两派之间的争斗，将决定这个共和国的未来。"
 crb_hanno_barca.1.f: "“迦太基的国家较早达到鼎盛，因而也较早走向衰落。在汉尼拔战争时期，人民已经在议事中掌握了最大的权力，而在罗马，元老院仍居主导。”\n\n——波利比乌斯，#italic 《历史》#!"
 crb_hanno_barca.1.a: "这场争论将决定迦太基的道路。"

 crb_hanno_barca.2.t: "巴卡派的胜利"
 crb_hanno_barca.2.d: "元老院终于让步了。公民大会重新获得了决定战争与和平的权力，军人和公民的代表走进了曾经只属于显贵家族的议事厅。\n\n在迦太基的街头，人们高呼着汉尼拔的名字。对他们而言，这只是开始：两千年前失去的土地，正等待着迦太基人归来。"
 crb_hanno_barca.2.f: "“我发誓，只要年龄允许，我将以火与剑与罗马为敌。”\n\n——汉尼拔·巴卡"
 crb_hanno_barca.2.a: "迦太基的军团将再次出征！"

 crb_hanno_barca.3.t: "汉诺派的胜利"
 crb_hanno_barca.3.d: "公民大会的呼声渐渐平息。元老们以审慎和耐心赢得了这场争斗，共和国的权柄依然握在显贵家族的手中。\n\n汉诺派相信，迦太基的未来在于丰饶的田野和遍布四海的商路。至于那些远征的梦想，就留给诗人去吟唱吧。"
 crb_hanno_barca.3.f: "“我认为应当把这个年轻人留在国内，让他在法律之下学会服从，学会与他人平等相处。”\n\n——大汉诺，见李维#italic 《建城以来史》#!"
 crb_hanno_barca.3.a: "审慎是共和国的美德。"

 crb_hanno_barca.4.t: "共和国的抉择"
 crb_hanno_barca.4.d: "整整四年，元老院与公民大会互不相让，任何一项重大决定都要在争吵中拖延数月。外国使节嘲笑说，迦太基有两个政府，却没有一个能做主。\n\n苏菲特们已经无法继续在两派之间周旋。[ROOT.GetCountry.GetName]必须作出选择，而被抛弃的一方绝不会轻易接受这个结果。"
 crb_hanno_barca.4.f: "“迦太基人被认为拥有一套优良的政体……民众始终忠于这一政体，从未发生过值得一提的内乱，也从未出现过僭主。”\n\n——亚里士多德，#italic 《政治学》#!"
 crb_hanno_barca.4.a: "站在公民大会一边。"
 crb_hanno_barca.4.b: "站在元老院一边。"

 crb_hanno_barca.5.t: "汉尼拔的继承者"
 crb_hanno_barca.5.d: "军营里流传着一种说法：古迦太基人也曾有过自己的国王，而真正的复兴需要一位能够统率全体布匿人的君主。\n\n一位名叫[SCOPE.sCharacter('crb_royalist_agitator').GetFullName]的军官正在士兵和公民中间宣扬这种主张。他的演说吸引了越来越多的听众。"
 crb_hanno_barca.5.f: "共和国给了我们议事厅，可议事厅从来没有为我们赢下过一场战争。"
 crb_hanno_barca.5.a: "让他说吧。"
