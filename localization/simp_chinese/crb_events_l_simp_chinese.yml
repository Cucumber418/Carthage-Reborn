 ############################################################
 # 开局事件：迦太基仍未毁灭……
 ############################################################
 crb_carthage.1.t: "迦太基仍未毁灭……"
 crb_carthage.1.d: "一千九百八十一年前，罗马人焚毁了迦太基，在废墟上犁地撒盐，宣告这座城市永远不复存在。然而在突尼斯的海岸与村庄里，布匿的语言、神祇和姓氏从未完全消失。\n\n如今，一群自称汉诺与巴卡后裔的元老在旧城废墟旁重开元老院，宣布迦太基重生。列强对此置若罔闻，邻国则虎视眈眈。在这片曾被诅咒的土地上，新生的[ROOT.GetCountry.GetName]必须向世界证明，迦太基仍未毁灭。"
 crb_carthage.1.f: "“此外，我认为迦太基必须被毁灭。”\n\n——马尔库斯·波尔基乌斯·加图"
 crb_carthage.1.a: "元老院将守护迦太基。"
 crb_carthage.1.b: "人民将重建迦太基。"

 crb_carthago_non_deleta: "迦太基仍未毁灭"
 crb_carthago_non_deleta_desc: "罗马人曾宣告迦太基永远不复存在。在列强承认我们之前，地中海上的每一艘商船都可能成为我们的猎物。"
 crb_tanit_temples_reopened: "塔尼特神庙重开"
 crb_tanit_temples_reopened_desc: "沉寂了两千年的神庙重新燃起了圣火，祭司们在新生的共和国中拥有举足轻重的地位。"
 crb_senate_will_guard: "元老院的守护"
 crb_people_will_rebuild: "人民的重建"

