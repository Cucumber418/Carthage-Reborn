 ############################################################
 # 迦太基特色事件
 ############################################################
 crb_flavor.1.t: "比尔萨山的牛皮"
 crb_flavor.1.d: "迦太基城中心的比尔萨山上，两户人家为了一块地的边界争执不下，官府派去的测量员也拿不出定论。\n\n一位年迈的商人在法庭上讲起了一个古老的故事：当年艾丽莎女王从推罗来到这里，当地人只答应给她一张牛皮能盖住的土地。她把牛皮割成细条，围住了整座山丘。"
 crb_flavor.1.f: "“他们买下了一块土地，用一张牛皮把它圈了起来，并因此称它为比尔萨。”\n\n——维吉尔，#italic 《埃涅阿斯纪》#!"
 crb_flavor.1.a: "照艾丽莎女王的办法，重新丈量比尔萨山。"
 crb_flavor.1.b: "地契上写的是什么，就是什么。"

 crb_flavor.2.t: "腓尼基字母"
 crb_flavor.2.d: "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]向政府提议，在全国的学校里教授布匿字母。他们说，这套字母曾经从推罗传到希腊，又从希腊传遍了整个欧洲，迦太基人自己却早已忘记了怎么书写它。\n\n反对者认为，这样做只会让孩子们多学一套用不上的文字。在大多数人还不识字的时候，教会他们读写才是当务之急。"
 crb_flavor.2.f: "“希腊人从腓尼基人那里学会了写字，罗马人又从希腊人那里学会了写字。”"
 crb_flavor.2.a: "在学校里教授布匿字母。"
 crb_flavor.2.b: "先让孩子们学会读写。"

 crb_flavor.3.t: "推罗紫"
 crb_flavor.3.d: "迦太基城外的一位染匠声称，他从海边的骨螺中提取出了古代的推罗紫。据说这种颜料一度比黄金还贵，只有国王和元老才有资格穿上用它染成的长袍。\n\n这位染匠希望政府资助他的染坊。也有几位欧洲收藏家写信来，愿意高价买下他的全部样品。"
 crb_flavor.3.f: "“一万只骨螺，才能染出一件长袍。”"
 crb_flavor.3.a: "资助染坊，让推罗紫重现于世。"
 crb_flavor.3.b: "签订五年的推罗紫供应合同，向欧洲收藏家持续供货。"

 crb_flavor.4.t: "马与棕榈"
 crb_flavor.4.d: "修缮旧港码头的工人在地基下挖出了一只陶罐，里面装满了古代的钱币。钱币的一面是女神的头像，另一面是一匹马和一棵棕榈树。\n\n财政官员建议把这些钱币熔掉，充入国库。也有人提议以这些古币为样式铸造新币，让迦太基的钱币重新带上马与棕榈。"
 crb_flavor.4.f: "“据说迦太基人在打地基时挖出了一颗马头，预示着这座城市将以骁勇和强大闻名。”"
 crb_flavor.4.a: "以古币为样式铸造新币。"
 crb_flavor.4.b: "熔铸古币，重新发行马与棕榈金币。"

 crb_flavor.5.t: "马戈的农书"
 crb_flavor.5.d: "一位学者在一座古老图书馆的藏书中，发现了马戈农书的残卷。马戈是古代迦太基最著名的农学家。罗马人攻陷迦太基之后，把城中的藏书都送给了努米底亚的国王，唯独下令把马戈的二十八卷著作译成拉丁文。\n\n[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]希望把这些残卷译成今天的文字，分发给各地的庄园。一家法国的农学会则提出，愿意出钱买下残卷的翻译权。"
 crb_flavor.5.f: "“买了一块地的人，就应该卖掉他在城里的房子。”\n\n——迦太基的马戈"
 crb_flavor.5.a: "译成今天的文字，分发给各地的庄园。"
 crb_flavor.5.b: "把五年的翻译与出版特许权卖给法国人。"

 crb_flavor.6.t: "布匿人的信义"
 crb_flavor.6.d: "在最近的一次外交招待会上，一位欧洲大使当着众人的面开玩笑说，与迦太基人签约之前，最好先数一数自己的手指。在拉丁语里，“布匿人的信义”从来都是背信弃义的意思。\n\n我们的使节当场离席。现在，外交部门在等待政府的指示。"
 crb_flavor.6.f: "“对罗马人来说，迦太基人的信义就是不讲信义。”"
 crb_flavor.6.a: "提出正式抗议。"
 crb_flavor.6.b: "用行动证明迦太基人的信义。"

 crb_flavor.7.t: "迦太基必须毁灭"
 crb_flavor.7.d: "罗马的一家报纸在头版刊登了一幅漫画：一位身穿托加的老人站在元老院里，指着地图上的迦太基。漫画下面写着一行字：“此外，我认为迦太基必须被毁灭。”\n\n这份报纸很快传到了迦太基。广场上的人们在争论，究竟应该把它当作一个玩笑，还是一种威胁。"
 crb_flavor.7.f: "老加图在元老院的每一次发言，无论议题是什么，都以同一句话结束。"
 crb_flavor.7.a: "迦太基不会被第二次毁灭！"
 crb_flavor.7.b: "一句两千年前的老话，伤不了迦太基。"

 crb_flavor.8.t: "战象"
 crb_flavor.8.d: "几位军官向政府提交了一份计划：从苏丹购买大象，重建迦太基的战象部队。他们说，汉尼拔正是带着战象翻过了阿尔卑斯山，没有什么比这更能让敌人胆寒。\n\n参谋部的其他人对此不以为然。在步枪和火炮的时代，大象只会成为最好的靶子。"
 crb_flavor.8.f: "“汉尼拔带着三十七头大象，从新迦太基出发了。”"
 crb_flavor.8.a: "在阅兵式上展示战象。"
 crb_flavor.8.b: "这个时代需要的是大炮，不是大象。"

 crb_flavor.9.t: "萨朗波"
 crb_flavor.9.d: "法国作家古斯塔夫·福楼拜出版了一部以古代迦太基为背景的小说，名为#italic 《萨朗波》#!。小说讲述了第一次布匿战争之后的雇佣兵战争，以及哈米尔卡·巴卡的女儿萨朗波的故事。\n\n这本书在巴黎大受欢迎，迦太基的名字又一次出现在了欧洲的沙龙里。但也有迦太基的学者批评说，书中的迦太基充满了血腥和异国情调，不过是法国人想象中的东方。"
 crb_flavor.9.f: "“这是在迦太基的近郊梅加拉，在哈米尔卡的花园里。”\n\n——古斯塔夫·福楼拜，#italic 《萨朗波》#!"
 crb_flavor.9.a: "邀请福楼拜先生来迦太基看看。"
 crb_flavor.9.b: "这是法国人想象中的迦太基。"

 crb_flavor.10.t: "海底的沉船"
 crb_flavor.10.d: "几位渔民在近海撒网时，捞上来一截古老的船板，上面还刻着布匿字母。潜水员随后在海底找到了一整艘沉船，船舱里堆满了双耳陶罐。\n\n[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]希望把沉船打捞上来，在迦太基建一座博物馆。也有欧洲的收藏家闻讯赶来，开出了很高的价钱。"
 crb_flavor.10.f: "“船板上的字母是工匠留下的记号。他们按照编号，一块一块地拼出了整个船体。”"
 crb_flavor.10.a: "建一座博物馆，把它留在迦太基。"
 crb_flavor.10.b: "授予收藏家五年的打捞与展出特许。"

 crb_flavor.11.t: "百零四人议会"
 crb_flavor.11.d: "一群法官向$RULER_TITLE_CRB_SUFETE$请愿，要求恢复古代的百零四人议会。在古代迦太基，这个议会专门审查打了败仗的将军，许多将军因此被处死。\n\n法官们说，这是共和国约束军队的传统。[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]则回应说，没有哪个将军愿意在敌人和法庭之间两面作战。"
 crb_flavor.11.f: "“迦太基的将军们在战场上害怕敌人，回到家里害怕法官。”"
 crb_flavor.11.a: "恢复百零四人议会。"
 crb_flavor.11.b: "将军只对$RULER_TITLE_CRB_SUFETE$负责。"

 crb_flavor.12.t: "梅尔卡特的节日"
 crb_flavor.12.d: "每年春天，迦太基人都会纪念推罗的守护神梅尔卡特。据说古代的迦太基每年都会派使者回到推罗，向梅尔卡特的神庙献上祭品。\n\n今年，[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]希望举办一场盛大的游行，让神像从旧港一直巡行到比尔萨山。这需要一大笔钱。"
 crb_flavor.12.f: "“城市之王梅尔卡特，在冬天死去，又在春天复活。”"
 crb_flavor.12.a: "举办盛大的游行。"
 crb_flavor.12.b: "照往年的规模举行。"

 crb_flavor.13.t: "锡之路"
 crb_flavor.13.d: "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]找到了一份古老的航海记录。早在罗马人到来之前，迦太基的船队就已经穿过赫拉克勒斯之柱，沿着大西洋海岸北上，去遥远的锡岛换取锡矿。如今人们知道，那些岛屿就在不列颠。\n\n船主们希望政府出面，与英国人商谈新的贸易协定。[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]则认为，迦太基的未来在非洲的土地上，而不在北方的海上。"
 crb_flavor.13.f: "“迦太基的船长宁可把船弄沉，也不愿让罗马人跟着他找到锡岛。”"
 crb_flavor.13.a: "派使节去伦敦。"
 crb_flavor.13.b: "迦太基的未来在非洲。"

 crb_flavor.14.t: "汉尼拔的誓言"
 crb_flavor.14.d: "在塔尼特的神庙里，一位军官带着他九岁的儿子站在祭坛前，要孩子像当年的汉尼拔一样立下誓言：终其一生，永远与罗马为敌。\n\n这件事很快在城里传开了。巴卡派的报纸称赞这位父亲，元老们却担心，这样的仪式会让下一代人只记得仇恨。"
 crb_flavor.14.f: "“我发誓，永远不做罗马人的朋友。”\n\n——汉尼拔的誓言"
 crb_flavor.14.a: "让他立下誓言。"
 crb_flavor.14.b: "孩子还小，不该背负上一代人的仇恨。"

 crb_flavor.15.t: "撒盐的传说"
 crb_flavor.15.d: "一位欧洲的历史学家发表文章说，罗马人在攻陷迦太基之后往土地里撒盐的故事，在任何一部古代著作中都找不到记载，很可能是后人编造的。\n\n这篇文章在迦太基引起了轩然大波。[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]认为应当尊重史料，许多公民却觉得，这是在替罗马人开脱。"
 crb_flavor.15.f: "“罗马人把这座城市烧了整整十七天。至于盐，那是后来的人加上去的。”"
 crb_flavor.15.a: "历史就是历史。"
 crb_flavor.15.b: "迦太基人记得自己的苦难。"

 crb_flavor.16.t: "海上的私掠"
 crb_flavor.16.d: "一艘迦太基的私掠船在西西里海峡截获了一艘欧洲商船，把它连同货物一起押回了港口。船长要求按照惯例分得战利品。\n\n商船的主人在领事馆里大声抗议，说迦太基人和巴巴里海盗没有什么两样。"
 crb_flavor.16.f: "“海上没有国界，只有船和风。”"
 crb_flavor.16.a: "允许私掠船队继续活动，按惯例分配收益。"
 crb_flavor.16.b: "放船回去，迦太基不是海盗。"

 crb_flavor.17.t: "高卢人？"
 crb_flavor.17.d: "北非战场上，迦太基军队与法国军队迎面交锋。一名老兵望着法军阵线，忽然想起这片土地以西的高卢古地。汉尼拔曾率领高卢盟军翻越阿尔卑斯山，与罗马人交锋。有人在营中笑问：“高卢人？”这句玩笑很快传遍了军营。\n\n将领们借用这段往事激励士兵：昔日布匿军团与高卢人并肩作战，今日的迦太基军队也要让来自高卢故地的敌人付出代价。"
 crb_flavor.17.f: "“汉尼拔曾带着高卢人翻越阿尔卑斯山。我们没有忘记。”"
 crb_flavor.17.a: "让士兵记住汉尼拔的旧日盟友。"

