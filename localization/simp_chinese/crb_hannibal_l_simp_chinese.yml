 je_crb_hannibal_returns: "汉尼拔再临"
 je_crb_hannibal_returns_lobby: "如果巴卡派赢得了两派之争，迦太基将着手恢复布匿战争之前的疆域：从的黎波里到伊比利亚，从西西里到古老的推罗。"
 je_crb_hannibal_returns_reason: "公民大会已经作出了决定：迦太基将收复祖先的土地。从阿非利加的海岸到西西里的城市，从地中海诸岛到伊比利亚的银矿，每一寸曾经属于迦太基的土地都在等待它的主人归来。"

