 je_crb_hannibal_returns: "汉尼拔再临"
 je_crb_hannibal_returns_lobby: "如果巴卡派赢得了两派之争，迦太基将着手恢复布匿战争之前的疆域：从的黎波里到伊比利亚，从西西里到古老的推罗。"
 je_crb_hannibal_returns_reason: "公民大会已经作出了决定：迦太基将收复祖先的土地。从阿非利加的海岸到西西里的城市，从地中海诸岛到伊比利亚的银矿，每一寸曾经属于迦太基的土地都在等待它的主人归来。"
 crb_hannibal_tripoli_tt: "#b 渗透：的黎波里#!：迦太基或实际附庸控制整个的黎波里与昔兰尼加"
 crb_hannibal_numidia_tt: "#b 征服：努米底亚#!：迦太基或实际附庸控制整个阿尔及尔、君士坦丁与奥兰"
 crb_hannibal_syracuse_tt: "#b 再临：叙拉古#!：迦太基或实际附庸控制整个西西里"
 crb_hannibal_islands_tt: "#b 吞并：地中海诸岛#!：迦太基或实际附庸控制巴利阿里群岛、马耳他、克里特与塞浦路斯"
 crb_hannibal_iberia_tt: "#b 夺回：伊比利亚#!：迦太基或实际附庸控制整个下安达卢西亚"
 crb_hannibal_new_carthage_tt: "#b 复兴：新迦太基#!：迦太基与实际附庸在西班牙本土合计拥有至少#v 3#!个州"
 crb_hannibal_tyre_tt: "#b 回归：旧王座故土#!：迦太基或实际附庸在黎巴嫩拥有土地"
 crb_hannibal_triumph: "汉尼拔的凯旋"
 crb_hannibal_stability: "稳固的统治"
 crb_rapid_integration: "加速整合"
 crb_mediterranean_islands: "地中海诸岛的主人"
 crb_ancestral_throne: "旧王座故土"
 crb_ancestral_throne_desc: "迦太基人回到了艾莉莎女王出发的地方。"
 crb_hannibal_returned: "汉尼拔再临"
 crb_hannibal.0.t: "汉尼拔再临"
 crb_hannibal.0.d: "公民大会以压倒性的多数通过了决议：迦太基将收复布匿战争之前的全部疆域。\n\n在迦太基的广场上，人们把这一天称作“汉尼拔的归来”。将军们已经在地图上标出了目标：的黎波里、努米底亚、西西里、地中海诸岛、伊比利亚，以及迦太基人最古老的故乡推罗。商船把消息带往海的另一边，外国使节则忙着向各自的宫廷写信。"
 crb_hannibal.0.f: "“我们要么找到一条路，要么开辟一条路。”\n\n——相传为汉尼拔所言"
 crb_hannibal.0.a: "迦太基的军团，出征！"
 crb_hannibal.1.t: "渗透：的黎波里"
 crb_hannibal.1.d: "锡尔特湾沿岸的商港再次挂起了迦太基的旗帜。两千年前，大莱普提斯、奥亚和萨布拉塔曾向迦太基缴纳贡赋。如今，的黎波里与昔兰尼加重新进入共和国的势力范围。\n\n新领土的治理将由元老院另行议定。眼下，公民大会首先向凯旋的将士致意。"
 crb_hannibal.1.f: "恩波里亚的商路通向沙漠的深处，那里有黄金、象牙和奴隶。"
 crb_hannibal.1.a: "建立的黎波里商站，让他们替我们看守东方的边界。"
 crb_hannibal.1.c: "效仿罗马人，派总督去治理的黎波里。"
 crb_hannibal.2.t: "征服：努米底亚"
 crb_hannibal.2.d: "阿尔及尔、君士坦丁与奥兰已在迦太基的掌握之中。古代努米底亚的土地再次与共和国联结，元老们开始将目光投向更西方的摩洛哥。\n\n我们应当巩固已有的成果，并为下一次远征作好准备。"
 crb_hannibal.2.f: "“努米底亚骑兵站在哪一边，胜利就站在哪一边。”"
 crb_hannibal.2.a: "重建努米底亚王国，由迦太基人选定国王。"
 crb_hannibal.2.c: "效仿罗马人，把努米底亚变成迦太基的行省。"
 crb_hannibal.3.t: "再临：叙拉古"
 crb_hannibal.3.d: "西西里终于回到了迦太基的手中。三次布匿战争中，迦太基人为这座岛屿流了太多的血，而如今齐兹和叙拉古的城墙上都飘扬着迦太基的旗帜。\n\n运粮船重新驶向阿非利加，城中的官署也开始整理散乱的税册。旧战场仍留在村镇之间，而港口里归来的商人已经谈起下一季的收成。"
 crb_hannibal.3.f: "西西里是迦太基与罗马之间的跳板，谁握有它，谁就握有地中海的钥匙。"
 crb_hannibal.3.a: "不惜代价，尽快整合西西里。"
 crb_hannibal.3.b: "稳步推进，巩固统治。"
 crb_hannibal.4.t: "吞并：地中海诸岛"
 crb_hannibal.4.d: "从伊博西姆到基提翁，地中海上的岛屿都已归属迦太基。这些岛屿曾是腓尼基商船的中转站，如今它们再次成为迦太基舰队的港口。"
 crb_hannibal.4.f: "海是迦太基人的田野。"
 crb_hannibal.4.a: "地中海再次成为布匿人的内海。"
 crb_hannibal.5.t: "夺回：伊比利亚"
 crb_hannibal.5.d: "加迪尔，腓尼基人在西方建立的最古老的城市，再次回到了布匿人的手中。站在城外的海岸上，可以望见赫拉克勒斯之柱，古代的布匿水手称之为美刻尔之柱。\n\n从这里出发，迦太基可以再次深入伊比利亚的腹地。"
 crb_hannibal.5.f: "美刻尔之柱以外，是只属于迦太基人的大洋。"
 crb_hannibal.5.a: "尽快整合加迪尔。"
 crb_hannibal.5.b: "稳步推进，巩固统治。"
 crb_hannibal.6.t: "复兴：新迦太基"
 crb_hannibal.6.d: "伊比利亚的港口和道路重新迎来了迦太基人。古老的新迦太基曾是巴卡家族经营海外领地的中心，也曾是汉尼拔远征的起点。\n\n公民大会为这一成就欢呼。至于当地应由商站、行省还是共和国直接治理，将另作安排。"
 crb_hannibal.6.f: "“伊比利亚的白银支付了汉尼拔的远征。”"
 crb_hannibal.6.a: "照巴卡家族的先例，建立伊比利亚商站。"
 crb_hannibal.6.c: "效仿罗马人，设立伊比利亚行省。"
 crb_hannibal.7.t: "回归：旧王座故土"
 crb_hannibal.7.d: "迦太基的军队进入了推罗。近三千年前，艾莉莎女王从这座城市出发，渡海来到阿非利加，建立了迦太基。如今，她的子孙回来了。\n\n在城中最古老的美刻尔神庙前，苏菲特献上了祭品。"
 crb_hannibal.7.f: "女儿回到了母亲的家。"
 crb_hannibal.7.a: "迦太基人回家了。"
 crb_hannibal.8.t: "汉尼拔的遗志"
 crb_hannibal.8.d: "布匿战争之前的疆域已经全部收复。从推罗到加迪尔，从西西里到的黎波里，迦太基再次成为地中海上的强国。\n\n然而在公民大会里，已经有人开始谈论阿尔卑斯山另一边的那座城市。"
 crb_hannibal.8.f: "“罗马人，你们的城门前站着汉尼拔！”"
 crb_hannibal.8.a: "汉尼拔的事业尚未完成。"
