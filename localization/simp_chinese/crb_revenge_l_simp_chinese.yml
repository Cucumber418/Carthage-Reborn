 je_crb_punic_war: "第[GetPlayer.GetCustom('crb_punic_war_ordinal')]次布匿战争"
 je_crb_punic_war_concluded: "布匿战争"
 je_crb_punic_war_reason: "迦太基与西西里的统治者再次兵戎相见。三次布匿战争都以迦太基的失败告终，这一次，迦太基人决心夺回那座岛屿。"
 crb_punic_war_mobilize_button: "动员公民"
 crb_punic_war_mobilize_button_desc: "在广场上宣读战争的理由，号召公民为迦太基而战。"
 crb_punic_war_mobilize_cooldown_tt: "近一年内未曾动员公民"
 crb_punic_war_mobilize_support_tt: "我们在所有战争中的[concept_war_support]增加#v 5#!点"
 crb_punic_war_pledge_button: "元老院的承诺"
 crb_punic_war_pledge_button_desc: "元老院公开承诺，这一次绝不会像当年那样抛弃前线的将军。"
 crb_punic_war_pledge_cooldown_tt: "近两年内元老院未曾作出承诺"
 crb_punic_war_mobilization: "动员公民"
 crb_senate_war_pledge: "元老院的承诺"
 crb_punic_war_victory: "布匿战争的胜利"
 crb_punic_war.1.t: "第[ROOT.GetCountry.GetCustom('crb_punic_war_ordinal')]次布匿战争"
 crb_punic_war.1.d: "战端已开。迦太基人的对手是西西里的统治者，这座岛屿曾经让迦太基人付出了三场战争的代价。\n\n在公民大会上，有人高声念出了历次布匿战争的名字。广场上的人群接着念出了下一个：第[ROOT.GetCountry.GetCustom('crb_punic_war_ordinal')]次布匿战争。"
 crb_punic_war.1.f: "“迦太基人在西西里输掉了第一次战争，在意大利输掉了第二次，在阿非利加输掉了第三次。这一次，我们要在西西里赢回来。”"
 crb_punic_war.1.a: "为了迦太基！"
 crb_punic_war.2.t: "西西里属于迦太基"
 crb_punic_war.2.d: "整座西西里岛都已落入迦太基的手中。从齐兹到叙拉古，迦太基的旗帜飘扬在每一座城市的城墙上。\n\n将军们提议乘胜追击，把撒丁和基尔诺斯也一并收入囊中。元老们则提醒说，列强已经开始注意迦太基的扩张了。"
 crb_punic_war.2.f: "这一次，罗马人没能等到他们的西庇阿。"
 crb_punic_war.2.a: "胜利已经足够了。"
 crb_punic_war.2.b: "撒丁和基尔诺斯也将属于迦太基。"
 crb_punic_war.3.t: "又一次布匿战争的失败"
 crb_punic_war.3.d: "战争结束了，西西里依然不在迦太基的手中。归来的士兵们沉默地穿过城门，广场上没有欢呼。\n\n但迦太基人记得，汉尼拔的父亲在第一次布匿战争失败之后，让年幼的儿子在祭坛前立下了誓言。"
 crb_punic_war.3.f: "失败只是下一场战争的序幕。"
 crb_punic_war.3.a: "我们会回来的。"
 je_crb_revenge_road: "两千年的复仇路"
 je_crb_revenge_road_lobby: "建立新迦太基之后，迦太基将沿着汉尼拔当年的足迹，翻过比利牛斯山和阿尔卑斯山，向罗马复仇。"
 je_crb_revenge_road_reason: "两千年前，汉尼拔带着他的军队和战象从新迦太基出发，翻过比利牛斯山，渡过罗讷河，越过阿尔卑斯山，在意大利的土地上击败了一支又一支罗马军团。他差一点就攻下了罗马。\n\n如今，迦太基再次站在了新迦太基。这条路还在那里。"
 crb_revenge_status_0: "点击下方的#b 翻过比利牛斯！#!，踏上汉尼拔的道路。"
 crb_revenge_status_1: "拿下西班牙的地中海沿岸之后，可以#b 越过高卢！#!"
 crb_revenge_status_2: "拿下汉尼拔经过的高卢土地之后，可以#b 翻过阿尔卑斯！#!"
 crb_revenge_status_3: "拿下阿尔卑斯山两侧的土地之后，可以开始#b 复仇#!。"
 crb_revenge_status_4: "拿下罗马并结束战争，复仇就将完成。"
 crb_revenge_status_5: "复仇已经完成。迦太基新获得的土地，仍可以在这里组建为商站或行省。"
 crb_punic_war_over_tt: "已不再与持有西西里土地的国家对峙或交战"
 crb_revenge_rome_taken_tt: "迦太基或其傀儡国、商站拥有整个#b 拉齐奥#!（罗马）"
 crb_revenge_stage1_lands_tt: "迦太基或其傀儡国、商站拥有整个#b 加泰罗尼亚#!、#b 巴伦西亚#!、#b 穆尔西亚#!、#b 上安达卢西亚#!和#b 下安达卢西亚#!"
 crb_revenge_stage2_lands_tt: "迦太基或其傀儡国、商站拥有整个#b 朗格多克#!、#b 普罗旺斯#!和#b 罗讷#!"
 crb_revenge_stage3_lands_tt: "迦太基或其傀儡国、商站拥有整个#b 瑞士#!、#b 萨伏依#!、#b 皮埃蒙特#!、#b 伦巴第#!和#b 威尼西亚#!"
 crb_revenge_stage4_lands_tt: "迦太基或其傀儡国、商站拥有意大利本土和撒丁的全部地区"
 crb_revenge_loyalty: "忠于共和国"
 crb_revenge_complete: "两千年的复仇"
 crb_revenge_complete_desc: "罗马人曾宣告迦太基必须毁灭。如今，迦太基的旗帜飘扬在卡皮托利山上。"
 crb_revenge_stage1_button: "翻过比利牛斯！"
 crb_revenge_stage1_button_desc: "汉尼拔的远征从新迦太基开始，沿着伊比利亚的海岸向北进发。"
 crb_revenge_stage2_button: "越过高卢！"
 crb_revenge_stage2_button_desc: "翻过比利牛斯山之后，汉尼拔穿过高卢南部，渡过了罗讷河。"
 crb_revenge_stage3_button: "翻过阿尔卑斯！"
 crb_revenge_stage3_button_desc: "公元前218年的深秋，汉尼拔带着他的军队和战象翻过了阿尔卑斯山。"
 crb_revenge_stage4_button: "复仇开始！"
 crb_revenge_stage4_button_desc: "阿尔卑斯山已经在我们身后，罗马就在前方。"
 crb_expand_trading_posts_decision: "扩张商站"
 crb_expand_trading_posts_decision_desc: "将新近取得的非首都土地交给对应的商站或行省治理。"
 crb_expand_trading_posts_decision_tooltip: "向实际附庸移交其对应区域内的新领土。"
 crb_can_expand_trading_posts_tt: "我们在实际附庸对应区域内拥有可移交的非首都州，且该州不在殖民中"
 crb_expand_trading_posts_effect_tt: "将我们直接管辖且未在殖民中的非首都州，移交给相应区域内的既有商站或行省。迦太基本土、西西里、现任首都和殖民中地区不会移交。"
 crb_convert_to_islam_decision: "皈依伊斯兰教"
 crb_convert_to_islam_decision_desc: "为了在这片土地上存活，我们的执政官们只好带头改信周边的宗教……"
 crb_convert_to_islam_decision_tooltip: "把国教改为国内信众最多的伊斯兰教派。"
 crb_islam_share_tt: "本国信仰伊斯兰教的人口超过#v 40%#!"
 crb_converted_to_islam: "背弃塔尼特"
 crb_carthaginian_protection: "迦太基的庇护"
 crb_carthaginian_hegemony: "迦太基的霸权"
 crb_revenge.0.t: "汉尼拔的道路"
 crb_revenge.0.d: "新迦太基的港口里停满了迦太基的船只。在城外的山丘上，老兵们指着北方说：汉尼拔就是从这里出发的。\n\n公民大会里，越来越多的人开始谈论那条路。比利牛斯山、罗讷河、阿尔卑斯山，然后是罗马。"
 crb_revenge.0.f: "“我们要么找到一条路，要么开辟一条路。”"
 crb_revenge.0.a: "这条路还在那里。"
 crb_revenge.1.t: "翻过比利牛斯！"
 crb_revenge.1.d: "将军们在地图上画出了第一段路线：沿着伊比利亚的地中海沿岸，从新迦太基一直向北，直到比利牛斯山脚下。\n\n元老们担心，重提祖先的疆界会使邻国惊疑，让旧有盟约蒙上阴影。将军们则回答说，汉尼拔从来不等别人同意。"
 crb_revenge.1.f: "公元前218年春，汉尼拔率领九万步兵、一万二千骑兵和三十七头战象离开了新迦太基。"
 crb_revenge.1.a: "宣称西班牙的地中海沿岸。"
 crb_revenge.1.b: "暂不宣称，先稳固国内。"
 crb_revenge.2.t: "越过高卢！"
 crb_revenge.2.d: "比利牛斯山已经在身后。前方是高卢南部的平原，以及汹涌的罗讷河。当年，汉尼拔用木筏把战象运过了这条河。如今，来自河岸集镇的消息堆满了桌案，将军们再次翻开记述那次渡河的旧战史。"
 crb_revenge.2.f: "“战象被赶上覆盖着泥土的木筏，以为自己仍然站在陆地上。”\n\n——波利比乌斯，#italic 《历史》#!"
 crb_revenge.2.a: "宣称汉尼拔经过的高卢土地。"
 crb_revenge.2.b: "暂不宣称，先稳固国内。"
 crb_revenge.3.t: "翻过阿尔卑斯！"
 crb_revenge.3.d: "高卢已经在我们手中，阿尔卑斯山就在眼前。当年，汉尼拔在深秋翻越雪山，损失了将近一半的军队，但他还是到达了意大利。\n\n如今，我们有铁路和电报，但雪山依然是雪山。山隘已由不同的君主把守，旧道上的积雪也不会记得那些久远的军旗。"
 crb_revenge.3.f: "“你们现在翻越的，不仅是意大利的城墙，更是罗马城的城墙。”\n\n——汉尼拔，见李维#italic 《建城以来史》#!"
 crb_revenge.3.a: "宣称瑞士和意大利北部。"
 crb_revenge.3.b: "暂不宣称，先稳固国内。"
 crb_revenge.4.t: "复仇开始！"
 crb_revenge.4.d: "阿尔卑斯山已经在我们身后。从这里，可以一路向南直抵罗马。两千年前，汉尼拔站在罗马城下，却最终没有攻城。\n\n军官们围着意大利的地图，争论通向台伯河的道路。公民大会里，汉尼拔的名字又一次压过了其他声音。"
 crb_revenge.4.f: "“汉尼拔，你知道如何取胜，却不知道如何利用胜利。”\n\n——马哈巴尔，见李维#italic 《建城以来史》#!"
 crb_revenge.4.a: "宣称整个意大利。"
 crb_revenge.4.b: "暂不宣称，先稳固国内。"
 crb_revenge.9.t: "复仇完成！"
 crb_revenge.9.d: "罗马已经属于迦太基，战争也已经结束。两千年前，罗马人焚毁了迦太基，在废墟上撒盐，宣告这座城市永远不复存在。\n\n今天，迦太基的苏菲特站在了卡皮托利山上。"
 crb_revenge.9.f: "迦太基仍未毁灭。"
 crb_revenge.9.a: "两千年的复仇，终于完成了。"
 crb_carthaginian_protection_desc: "迦太基为新设属地提供有限的政治庇护：每周自由欲变化额外降低0.05，正向增长速度降低5%。最终变化仍由正常附庸机制结算。"
 crb_carthaginian_hegemony_desc: "迦太基维系海外属地的纽带，使各附庸每周自由欲变化额外降低0.02。"
