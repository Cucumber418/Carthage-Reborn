 crb_hanno_barca_random.10.t: "老兵的请愿"
 crb_hanno_barca_random.10.d: "一群从前线归来的老兵聚集在元老院门前。他们说，自己为迦太基流过血，却连在公民大会上发言的资格都没有。\n\n他们的代表把一份请愿书交给了苏菲特：要么让老兵成为完全的公民，要么至少兑现战前许诺的赏金。"
 crb_hanno_barca_random.10.f: "“我们在君士坦丁的城墙下没有问过谁是贵族，谁是平民。”"
 crb_hanno_barca_random.10.a: "为迦太基而战的人，就是迦太基的公民。"
 crb_hanno_barca_random.10.b: "发放赏金，让他们回家去吧。"
 crb_hb_veterans_enfranchised: "老兵获得公民权"
 crb_hb_veterans_paid: "老兵的赏金"

 crb_hanno_barca_random.11.t: "元老院的宴会"
 crb_hanno_barca_random.11.d: "几个最古老的元老家族联名邀请苏菲特出席一场宴会。宴会设在俯瞰旧港的一座别墅里，据说席间将商议今年的税赋和粮价。\n\n所有人都明白，赴宴就意味着站到元老们一边。拒绝则会被视为对显贵家族的冒犯。"
 crb_hanno_barca_random.11.f: "“葡萄酒是从西西里运来的，客人是从迦太基最好的家族中挑出来的，而真正的议题从来不会写在请柬上。”"
 crb_hanno_barca_random.11.a: "赴宴，与元老们共商国事。"
 crb_hanno_barca_random.11.b: "婉言谢绝，国事应在议事厅里商议。"
 crb_hb_senate_banquet_attended: "出席元老院的宴会"
 crb_hb_senate_banquet_declined: "拒绝元老院的宴会"

 crb_hanno_barca_random.12.t: "广场上的演说"
 crb_hanno_barca_random.12.d: "一位年轻的演说家每天清晨都站在集会广场的台阶上，向聚集的店主、工匠和码头工人讲述巴卡家族的往事。他说，元老们当年出卖了汉尼拔，如今又想出卖迦太基的未来。\n\n听众一天比一天多。元老院要求政府驱散这些集会。"
 crb_hanno_barca_random.12.f: "“他们管这叫秩序。可在我看来，这不过是少数人的安宁。”"
 crb_hanno_barca_random.12.a: "让他说吧，公民有权议论国事。"
 crb_hanno_barca_random.12.b: "驱散人群，广场不是元老院。"
 crb_hb_orator_tolerated: "容忍广场上的演说"
 crb_hb_orator_dispersed: "驱散广场上的集会"

 crb_hanno_barca_random.13.t: "船主的商路"
 crb_hanno_barca_random.13.d: "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]向政府递交了一份陈情书。他们抱怨说，地中海上的商船屡屡遭到劫掠，而政府却把钱都花在了陆军身上。\n\n军官们则反驳说，迦太基的敌人在陆地上，而不在海上。今年的预算只够满足其中一方。"
 crb_hanno_barca_random.13.f: "“迦太基生于海上，也将亡于海上。我们只请求诸位不要忘记这一点。”"
 crb_hanno_barca_random.13.a: "优先扩充陆军。"
 crb_hanno_barca_random.13.b: "优先保护商路。"
 crb_hb_army_first: "陆军优先"
 crb_hb_trade_first: "商路优先"

 crb_hanno_barca_random.14.t: "塔尼特的神谕"
 crb_hanno_barca_random.14.d: "塔尼特神庙的祭司们在新月之夜举行了献祭。据说神像前的火焰忽明忽暗，祭司们为此争论了整整三天。\n\n一派认为这预示着迦太基将在战场上取得胜利，另一派则坚持说，女神是在告诫迦太基人保持审慎。神庙请求苏菲特作出最终的解释。"
 crb_hanno_barca_random.14.f: "“塔尼特是巴力的面容。她注视着迦太基，从未离开。”"
 crb_hanno_barca_random.14.a: "女神预示着胜利。"
 crb_hanno_barca_random.14.b: "女神告诫我们审慎行事。"
 crb_hb_omen_of_victory: "胜利的神谕"
 crb_hb_omen_of_caution: "审慎的神谕"

 crb_hanno_barca_random.15.t: "拖欠的军饷"
 crb_hanno_barca_random.15.d: "军队已经三个月没有领到军饷了。负责拨款的元老们声称国库空虚，可士兵们都知道，这些元老自家的庄园从来没有缺过钱。\n\n营地里开始出现不满的声音。一些军官提议，应当向显贵家族征收一笔特别税来支付军饷。"
 crb_hanno_barca_random.15.f: "“当年从西西里归来的雇佣兵没有拿到报酬，结果把整个阿非利加都烧成了焦土。元老们是不是已经忘了？”"
 crb_hanno_barca_random.15.a: "向显贵家族征收特别税。"
 crb_hanno_barca_random.15.b: "让军队再等一等。"
 crb_hb_soldiers_paid_by_nobles: "显贵家族支付军饷"
 crb_hb_soldiers_unpaid: "拖欠的军饷"

 crb_hanno_barca_random.16.t: "谁是迦太基人？"
 crb_hanno_barca_random.16.d: "随着公民大会的权力日益扩大，一个问题变得无法回避：究竟谁才算是迦太基的公民？\n\n巴卡派主张，凡是会说布匿语、敬拜塔尼特的人都应当成为公民。元老们则坚持，公民身份只属于那些能够证明自己祖先的古老家族。"
 crb_hanno_barca_random.16.f: "“两千年过去了，谁的血管里还流着纯正的布匿血液？能流传下来的，只有语言和神祇。”"
 crb_hanno_barca_random.16.a: "会说布匿语的人都是迦太基人。"
 crb_hanno_barca_random.16.b: "公民身份只属于古老的家族。"
 crb_hb_open_citizenship: "开放的公民身份"
 crb_hb_closed_citizenship: "封闭的公民身份"

 crb_hanno_barca_random.17.t: "“国王”的流言"
 crb_hanno_barca_random.17.d: "军营里流传着一个说法：有人在宴会上举杯，称一位巴卡家族的将军为“王”。古迦太基也曾有过国王，这个称呼并不算陌生，但在共和国里，它足以令元老们彻夜难眠。\n\n元老院要求彻查此事。将军本人则对此一笑了之。"
 crb_hanno_barca_random.17.f: "“共和国需要的是胜利，至于胜利者叫什么名字，又有什么关系呢？”"
 crb_hanno_barca_random.17.a: "不过是醉后的胡话，一笑置之。"
 crb_hanno_barca_random.17.b: "追查流言的源头。"
 crb_hb_king_rumor_tolerated: "容忍“国王”的流言"
 crb_hb_king_rumor_investigated: "追查“国王”的流言"

 crb_hb_veterans_paid_expense: "补发老兵赏金"
 crb_hb_veterans_paid_expense_desc: "每周额外政府支出按触发时的GDP计算（原版 small 档），持续 12 个月。"
