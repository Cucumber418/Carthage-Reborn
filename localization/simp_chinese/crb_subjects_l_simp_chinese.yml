l_simp_chinese:
 subject_type_crb_trading_post: "$subject_type_crb_trading_post_no_icon$"
 subject_type_crb_trading_post_no_icon: "商站"
 subject_type_crb_province: "$subject_type_crb_province_no_icon$"
 subject_type_crb_province_no_icon: "行省"
 crb_trading_post: "商站"
 crb_trading_post_action_name: "$crb_trading_post$"
 crb_trading_post_action_propose_name: "使之成为商站"
 crb_trading_post_action_break_name: "准许独立"
 crb_trading_post_action_ask_to_break_name: "要求独立"
 crb_trading_post_desc: "$subject_type_crb_trading_post_desc$"
 crb_trading_post_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]是[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]的商站。\n\n$subject_type_crb_trading_post_desc$"
 crb_trading_post_action_notification_name: "要求成为商站"
 crb_trading_post_action_notification_desc: "[INITIATOR_COUNTRY.GetName]要求我们臣服，成为他们的商站。"
 crb_trading_post_action_notification_break_name: "给予独立"
 crb_trading_post_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName]结束了我们的商站地位。我们再次独立了。"
 crb_province: "行省"
 crb_province_action_name: "$crb_province$"
 crb_province_action_propose_name: "使之成为行省"
 crb_province_action_break_name: "准许独立"
 crb_province_action_ask_to_break_name: "要求独立"
 crb_province_desc: "$subject_type_crb_province_desc$"
 crb_province_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]是[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]的行省。\n\n$subject_type_crb_province_desc$"
 crb_province_action_notification_name: "要求成为行省"
 crb_province_action_notification_desc: "[INITIATOR_COUNTRY.GetName]要求我们臣服，成为他们的行省。"
 crb_province_action_notification_break_name: "给予独立"
 crb_province_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName]结束了我们的行省地位。我们再次独立了。"
 subject_type_crb_trading_post_desc: "商站是迦太基总督主持的海外商埠。总督代表宗主国处理政务，商人以契约联结港口、集市与远方的货源。商站享有贸易与港口特权，将收入的30%交给迦太基；不能自行发动外交博弈，并随宗主国参战。"
 subject_type_crb_province_desc: "行省由迦太基委任的总督治理。税吏丈量田亩、编订户籍，官员与巡查者把地方事务纳入总督府的秩序。行省将收入的50%交给迦太基；不能自行发动外交博弈，并随宗主国参战。"
