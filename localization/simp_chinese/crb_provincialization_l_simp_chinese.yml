l_simp_chinese:
 crb_provincialize_TRP_button: "行省化的黎波里"
 crb_provincialize_TRP_button_desc: "沿岸商埠的货单将并入总督府的税册，沙漠商路与港口一同接受官吏巡察。"
 crb_provincialize_NUM_button: "行省化努米底亚"
 crb_provincialize_NUM_button_desc: "内陆部族与沿岸城市将归入同一套户籍，谷地和牧场由总督派出的官员巡视。"
 crb_provincialize_IBT_button: "行省化伊比利亚"
 crb_provincialize_IBT_button_desc: "矿山、葡萄园与海港将编入统一的税册，昔日商社的账房成为总督府的官署。"
 crb_provincialize_GLT_button: "行省化高卢"
 crb_provincialize_GLT_button_desc: "罗讷河谷的城镇将接受总督巡察，港口的贸易契约让位于遍及内陆的赋税与户籍。"
 crb_provincialize_SNT_button: "行省化阿尔卑斯"
 crb_provincialize_SNT_button_desc: "山口的关卡与谷地的村镇将归总督统一管理，驿道把群山间的税吏和驻军联结起来。"
 crb_provincialize_IOP_button: "行省化罗马"
 crb_provincialize_IOP_button_desc: "伊奥尼亚商站将改为罗马行省，南意大利的港市与乡间由总督府编订税册、委派官员。"
 crb_provincialize_CPM_button: "行省化毛里塔尼亚"
 crb_provincialize_CPM_button_desc: "大西洋商埠与山间部族将纳入总督的辖区，商路上的驿站也将成为官府巡察的落脚处。"
 crb_provincialize_CPE_button: "行省化埃及"
 crb_provincialize_CPE_button_desc: "尼罗河畔的田亩、粮仓与水渠将由总督府登记，河港的账房开始为整片谷地征收赋税。"
 crb_provincialize_CPF_button: "行省化腓尼基"
 crb_provincialize_CPF_button_desc: "推罗与西顿的商人议事厅将向总督府交账，沿海城市的税册与官吏任用归于统一。"
 crb_provincialize_CPS_button: "行省化叙利亚"
 crb_provincialize_CPS_button_desc: "沿海商埠与内陆驿路将归入同一辖区，总督的巡察队沿商旅旧道进入各城。"
 crb_provincialize_CPB_button: "行省化美索不达米亚"
 crb_provincialize_CPB_button_desc: "两河之间的灌渠、田亩与粮仓将编入总督府的册籍，商旅的渡口也将设立税吏。"
 crb_provincialize_CPA_button: "行省化阿拉伯"
 crb_provincialize_CPA_button_desc: "绿洲、驼队驿站与海港将由总督府联结起来，地方首领须向官署呈报户籍与税赋。"
 crb_provincialize_post_required_tt: "该国仍是由迦太基直接管辖的商站，尚未改为行省。"
 crb_provincialize_destination_ready_tt: "对应的行省尚未另行存在。"
 crb_provincialize_territory_effect_tt: "将现有商站改为行省，保留其领土、人口、建筑、国库与军队。总督府接管税册与地方官员任用，缴款由收入的30%提高至50%，商站的贸易与港口特权随之结束。"
